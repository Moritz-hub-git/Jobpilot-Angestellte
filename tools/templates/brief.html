<!doctype html>
<html lang="{{SPRACHE}}">
<head>
<meta charset="utf-8">
<title>Anschreiben</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 210mm; height: 297mm; padding: 20mm 24mm 16mm;
         font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10.2pt;
         line-height: 1.44; color: #1a1f26; }
  .kopf { display: flex; justify-content: space-between; align-items: baseline;
          border-bottom: 1.5pt solid #1a1f26; padding-bottom: 3mm; margin-bottom: 6mm; }
  .kopf h1 { font-size: 15pt; letter-spacing: .02em; }
  .kopf .kontakt { text-align: right; font-size: 8.5pt; color: #555; line-height: 1.45; }
  .empfaenger { font-size: 9.5pt; color: #333; margin-bottom: 6mm; white-space: pre-line; }
  .datum { text-align: right; font-size: 9.5pt; color: #555; margin-bottom: 6mm; }
  h2.betreff { font-size: 11.5pt; margin-bottom: 5mm; }
  p { margin-bottom: 3.2mm; text-align: left; }
  .gruss { margin-top: 7mm; }
  .unterschrift { margin-top: 2mm; font-weight: 600; }
</style>
</head>
<body>
  <div class="kopf">
    <h1>Moritz Schumacher</h1>
    <div class="kontakt">me@moritz-schumacher.com<br>linkedin.com/in/moritz-schumacher<br>Dortmund, Deutschland</div>
  </div>
  <div class="empfaenger">{{EMPFAENGER}}</div>
  <div class="datum">{{ORT_DATUM}}</div>
  <h2 class="betreff">{{BETREFF}}</h2>
  {{ABSAETZE}}
  <p class="gruss">{{GRUSSFORMEL}}</p>
  <p class="unterschrift">Moritz Schumacher</p>
</body>
</html>
