  stellenangebotsBeschreibung: 'Unser Herz schlägt türkis. Arbeiten bei Motel One
    ist wie zu Freunden kommen, wo Wertschätzung und Unterstützung großgeschrieben
    werden und die individuelle Persönlichkeit willkommen ist. Wir begegnen uns auf
    Augenhöhe und verstehen uns als ein Team: von der Geschäftsführung bis zu den
    Auszubildenden. Mit unserer gemeinsamen Leidenschaft für modernes Design und hohe
    Servicequalität schaffen wir für unsere Gäste bei Motel One ein Zuhause für unterwegs.
    Unsere mehr als 90 Hotels in 13 Ländern überzeugen mit exklusivem Design, hohen
    Servicestandards und erstklassigen innerstädtischen Standorten zu einem attraktiven
    Preis. Als Begru?nder und Vorreiter des Budget Design Konzepts expandieren wir
    erfolgreich in den Metropolen Europas und darüber hinaus. Werden Sie Teil unseres
    Teams und gestalten Sie gemeinsam mit uns Motel One. Stellenbeschreibung Deine
    Mission KI verändert die Arbeitswelt ? und bei der Motel One Group wollen wir
    diese Veränderung aktiv gestalten. Als Manager IT (m/w/d) ? AI & Automation bist
    du unsere zentrale Ansprechperson für alles rund um Künstliche Intelligenz und
    Prozessautomatisierung. Du identifizierst Potenziale, entwickelst konkrete Use
    Cases und setzt diese gemeinsam mit unseren Fachbereichen um. Dabei bewegst du
    dich sicher zwischen technischer Umsetzung sowie strategischer Gestaltung und
    bringst so echten Mehrwert für unsere über 100 Hotels und unsere internen Teams.
    Deine Kernaufgaben AI Use Cases & Lösungsentwicklung Du erkennst frühzeitig, wo
    KI und Automatisierung echten Mehrwert schaffen - für unsere Gäste, unsere Hotels,
    unsere internen Teams und entwickelst daraus umsetzbare Konzepte. Du entwickelst
    und implementierst (Gen) AI- und LLM-basierte Anwendungen sowie KI-Agenten von
    der Anforderungsanalyse bis zum produktiven Einsatz. Du analysierst Anforderungen
    aus den Fachbereichen, übersetzt sie in technische Lösungsansätze und begleitest
    den gesamten Projektzyklus vom Proof of Concept bis zum Go-live. Du hältst dich
    über aktuelle KI-Technologien und -Plattformen auf dem Laufenden und bringst neue
    Impulse aktiv ins Team ein. Prozessautomatisierung Du erkennst Automatisierungspotenziale
    in bestehenden Workflows und setzt diese strukturiert um ? z.B. mit Power Automate
    oder Robotic Process Automation (RPA). Du entwickelst skalierbare Automatisierungslösungen
    in enger Abstimmung mit den betroffenen Bereichen und stellst deren Qualität sowie
    Stabilität sicher. Du dokumentierst Automatisierungsprozesse nachvollziehbar und
    sorgst für einen sauberen Übergang in den operativen Betrieb. Projektsteuerung
    & Enablement Du steuerst AI- und Automatisierungsprojekte eigenverantwortlich
    mit klarem Backlog, strukturierter Roadmap und agilen Methoden (Scrum/Kanban).
    Du entwickelst Entscheidungsvorlagen und präsentierst Ergebnisse adressatengerecht
    ? auch auf Management-Ebene. Du treibst den Wissenstransfer rund um KI im Unternehmen
    aktiv voran. Du konzipierst Enablement-Formate, Workshops und interne Kommunikation,
    die Neugier wecken und Kompetenz aufbauen. Du bist die Brücke zwischen IT, Fachbereichen
    und externen Partnern ? lösungsorientiert, kommunikationsstark und mit Blick auf
    den größtmöglichen Impact. Qualifikationen Dein Profil Abgeschlossenes Studium,
    z.B. in Wirtschaftsinformatik, Informatik, BWL oder vergleichbar Erste praktische
