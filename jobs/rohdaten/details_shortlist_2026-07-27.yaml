  stellenangebotsBeschreibung: "Künstliche Intelligenz wird die Art und Weise, wie\
    \ Unternehmen Software entwickeln, Prozesse automatisieren und Entscheidungen\
    \ treffen, grundlegend verändern. Bei SYNQONY möchten wir diese Entwicklung aktiv\
    \ mitgestalten. Unser Ziel ist es, moderne AI-Technologien sinnvoll in unsere\
    \ Produkte, Prozesse und Geschäftsmodelle zu integrieren und daraus nachhaltigen\
    \ Mehrwert für unsere Kunden und unser Unternehmen zu schaffen.\nWAS WIRST DU\
    \ MACHEN?Als\nAI Solution Lead (m/w/d) übernimmst du eine zentrale Rolle beim\
    \ Aufbau und der\nWeiterentwicklung unserer AI-Initiativen. Du identifizierst\
    \ Potenziale,\nentwickelst innovative Lösungen und begleitest deren Umsetzung\
    \ von der ersten\nIdee bis zum produktiven Einsatz.\nDein Aufgabenbereich\n •\
    \ Identifikation, Bewertung und Umsetzung innovativer AI-Anwendungsfälle mit messbarem\
    \ Business Impact\n • Konzeption und Entwicklung intelligenter Softwarelösungen\
    \ auf Basis moderner AI-Technologien\n • Bewertung, Auswahl und Einführung neuer\
    \ AI-Methoden, Modelle und Plattformen\n • Entwicklung von Prototypen, Proof-of-Conceptsund\
    \ produktionsreifen Lösungen\n • Konzeption von AI-Architekturen und Integration\
    \ in bestehende Produkte, Prozesse und Systemlandschaften\n • Zusammenarbeit mit\
    \ Entwicklung, Produktmanagement und Fachbereichen zur erfolgreichen Umsetzung\
    \ von AI-Initiativen\n • Aufbau und Weiterentwicklung von AI-Plattformen, Workflows\
    \ und wiederverwendbaren Komponenten\n • Definition von Qualitätsstandards, Evaluationsverfahren\
    \ und Best Practices für AI-Lösungen\n • Mitgestaltung unserer AI-Roadmap und\
    \ technologischen Ausrichtung\n • Aufbau von AI-Kompetenz im Unternehmen sowie\
    \ Unterstützung bei der Einführung und Nutzung neuer Technologien\n\nDas bringst\
    \ du mit\n • Mehrjährige Erfahrung in der Entwicklung moderner Softwarelösungen\
    \ – du hast komplexe Anwendungen konzipiert, entwickelt oder technisch begleitet\
    \ und verstehst, wie aus Ideen produktive Software entsteht.\n • Fundierte Erfahrung\
    \ mit generativer Künstlicher Intelligenz – du hast bereits praktisch mit aktuellen\
    \ AI-Technologien gearbeitet und weißt, wie sich diese sinnvoll und wirtschaftlich\
    \ in Geschäftsprozesse und Anwendungen integrieren lassen.\n • Tiefgehendes Verständnis\
    \ von Large Language Models und modernen AI-Architekturen – Themen wie LLMs, Retrieval\
    \ Augmented Generation (RAG), Embeddings, semantische Suche sowie Agenten- und\
    \ Tool-Integrationen sind für dich nicht nur Theorie, sondern Teil deiner praktischen\
    \ Arbeit.\n • Erfahrung im Prompt Engineering sowie der Evaluierung von AI-Systemen\
    \ – du weißt, wie hochwertige AI-Lösungen entwickelt, getestet und kontinuierlich\
    \ verbessert werden können, um verlässliche Ergebnisse zu liefern.\n • Ausgeprägtes\
    \ Architektur- und Systemverständnis – du denkst ganzheitlich, entwirfst tragfähige\
    \ Softwarearchitekturen und integrierst neue Technologien sicher und nachhaltig\
    \ in bestehende Systemlandschaften.\n • Praktische Erfahrung mit modernen AI-\
    \ und Entwicklungswerkzeugen – idealerweise hast du bereits mit Technologien wie\
    \ Python, OpenAI, Azure AI, LangChain, LlamaIndex, n8n oder vergleichbaren Plattformen\
    \ gearbeitet.\n • Kommunikationsstärke und Beratungskompetenz – du kannst komplexe\
    \ technische Zusammenhänge verständlich erklären und unterschiedliche Stakeholder\
    \ bei der Einführung neuer Technologien erfolgreich begleiten.\n • Hands-on-Mentalität\
    \ und Innovationsfreude – du arbeitest pragmatisch, probierst neue Ansätze aus\
    \ und hast Freude daran, aus Konzepten funktionierende Prototypen und produktive\
    \ Lösungen zu entwickeln.\n • Hohe Eigeninitiative und Lernbereitschaft – du verfolgst\
    \ technologische Entwicklungen aktiv, eignest dir neues Wissen schnell an und\
    \ bringst dieses gewinnbringend in Projekte ein.\n • Verhandlungssichere Deutschkenntnisse\
    \ auf Muttersprachniveau – um komplexe Themen klar, überzeugend und lösungsorientiert\
    \ zu kommunizieren.\n\nDarüber hinaus sind Erfahrungen in den folgenden Bereichen\
    \ von Vorteil:\n • Erfahrung mit Enterprise-Anwendungen – beispielsweise im Umfeld\
    \ von ERP-, CRM- oder Workflow-Systemen.\n • Praxiswissen im B2B-Umfeld – insbesondere\
    \ bei der Entwicklung, Einführung oder Skalierung produktiver AI-Anwendungen.\n\
    \ • Kenntnisse moderner AI-Infrastrukturen – beispielsweise im Umgang mit Vektordatenbanken,\
    \ AI-Governance-Themen oder Cloud-Plattformen wie Azure, AWS oder GCP.\n\nWas\
    \ dich erwartet\n • Eine spannende Tätigkeit in einem zukunftssicheren Umfeld:\
    \ Softwarelösungen für Umwelt & Nachhaltigkeit\n • Modernste Technik und spannende\
    \ Digitalisierungsprojekte\n • Home-Office & flexible Arbeitszeiten für die perfekte\
    \ Work-Life-Balance\n • Flache Hierarchien und kurze Entscheidungswege\n • Individuelle\
    \ Weiterbildungsmöglichkeiten für deine persönliche und berufliche Weiterentwicklung\n\
    \ • Team-Events und ein offenes Miteinander\n\nÜber uns SYNQONY | digitizing circular\
    \ economy \n\nWir sind eine starke wachsende Gruppe innovativer Softwareunternehmen,\
    \ die smarte Digitalisierungslösungen für Abfall- und Umweltmanagement entwickeln.\
    \ Wir unterstützen Unternehmen dabei, effizienter und umweltschonender zu arbeiten.\
    \ SYNQONY vereint technologische Innovation mit nachhaltigem Denken.Unsere Mission:\
    \ Den gesamten Lebenszyklus des Abfalls nahtlos zu digitalisieren – von seiner\
    \ Entstehung bei gewerblichen Abfallerzeugern und den privaten Haushalten, über\
    \ den Transport bis zum Recycling bzw. der Entsorgung und weiter bis zur Kommunikation\
    \ mit den Umweltbehörden.\n\nMit der SYNQONY-Software-Suite bilden wir die gesamte\
    \ Wertschöpfungskette der Kreislaufwirtschaft digital ab.\nDies umfasst die Entstehung\
    \ des Abfalls bei den Bürgern und gewerblichen Abfallerzeugern über die Beförderer\
    \ und Sammler sowie die gewerblichen und kommunalen Entsorger bis hin zu den Umweltämtern.\n\
    Jedem im Abfall- und Umweltmanagement bieten wir herausragende Produkte mit maximalem\
    \ Nutzen. Wir schaffen noch deutlich weitergehende Automatisierung und Optimierung\
    \ durch die Verbindung der beteiligten Akteure.Dieses Ziel erreichen wir mit unserem\
    \ vielfältigen Team aus Branchenexperten und Innovatoren, Kundenverstehern u"
