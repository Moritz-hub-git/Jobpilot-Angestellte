kelvion:
  stellenangebotsart: ARBEIT
  stellenangebotsTitel: Head of AI Solutions & Architecture (m/w/d)
  quereinstiegGeeignet: false
  stellenangebotsBeschreibung: "**Kelvion** \n\nUnsere Mission ist es, mit Innovationskraft\
    \ und Nachhaltigkeit die industrielle Transformation voranzutreiben. Ob bei der\
    \ Optimierung von Rechenzentren, der Weiterentwicklung der Wasserstoffproduktion\
    \ oder der Neugestaltung von Kühl- und Klimatechniksystemen – unsere thermischen\
    \ Schlüsseltechnologien stärken zahlreiche Branchen weltweit. Als „One Kelvion“\
    \ arbeiten wir kontinuierlich an Lösungen, die unsere Kunden noch erfolgreicher\
    \ machen und gleichzeitig zu einer nachhaltigeren Zukunft beitragen.  \n  \nWir\
    \ gestalten Zukunft – gemeinsam\n\n **Stellenbeschreibung** \n\n**Ihre Aufgaben**\n\
    \n* Sie definieren und entwickeln die unternehmensweite AI-Architektur sowie die\
    \ strategische AI-Roadmap.\n* Sie etablieren Referenzarchitekturen, Designprinzipien\
    \ und Standards für skalierbare AI- und datengetriebene Lösungen.\n* Sie sorgen\
    \ für die nahtlose Integration von AI-Lösungen in zentrale Unternehmenssysteme\
    \ wie ERP, CRM, MES und Datenplattformen.\n* Sie entwickeln das AI-Betriebsmodell\
    \ inklusive Plattformstrategie, MLOps/LLMOps und Lifecycle-Management.\n* Sie\
    \ verantworten das AI-Governance-Framework, inklusive Richtlinien, Risikobewertung,\
    \ Freigabeprozessen und Responsible-AI-Standards.\n* Sie steuern Vendor- und Plattformlandschaften,\
    \ Lizenzmodelle sowie Kosten- und Build-vs-Buy-Entscheidungen.\n* Sie priorisieren\
    \ das AI-Use-Case-Portfolio, skalieren Lösungen von PoC bis Produktion und führen\
    \ das AI-Team.\n\n**Ihre Qualifikation**\n\n* Sie verfügen über ein Studium in\
    \ Informatik, Informationstechnik, Engineering oder einem verwandten Bereich.\n\
    * Sie bringen mehrere Jahre Führungserfahrung in AI-, Data-, Cloud- oder Enterprise-Architekturrollen\
    \ mit.\n* Sie besitzen tiefes Wissen in AI/ML-Technologien, Datenplattformen und\
    \ Cloud-Architekturen im Microsoft-Ökosystem (Azure AI, Copilot, Power Platform).\n\
    * Sie haben Erfahrung in AI-Governance, Responsible-AI-Standards sowie regulatorischer\
    \ Compliance wie GDPR und EU AI Act und kennen Enterprise- und Security-Architekturprinzipien.\n\
    * Sie bringen fundierte technische Kompetenz in MLOps/LLMOps, SQL, SAP BW, Microsoft\
    \ Fabric und Power BI mit und verstehen den AI-Lifecycle ganzheitlich.\n* Sie\
    \ denken strategisch, kommunizieren souverän und führen komplexe funktionsübergreifende\
    \ Initiativen.\n* Sehr gute Deutsch-/Englischkenntnisse und internationale Reisebereitschaft\
    \ runden Ihr Profil ab.\n\nUnser Erfolg basiert auf Zusammenarbeit – wir fördern\
    \ vielfältiges Denken, hören einander zu und schätzen jede einzelne Stimme. Kreativität\
    \ entfaltet sich bei Kelvion dort, wo Menschen gehört, ihre Ideen willkommen geheißen\
    \ und ihre Beiträge anerkannt werden.\n\nMit einem flexiblen Arbeitsansatz stellen\
    \ wir das Wohlbefinden und die Zufriedenheit unserer Mitarbeitenden in den Mittelpunkt.\
    \ Dies stärkt die Bereitschaft sich einzubringen und eröffnet damit neue Karrierechancen\
    \ Wir ermutigen engagierte Persönlichkeiten ihre Entwicklung selbst in die Hand\
    \ zu nehmen, neue Wege zu gehen und gemeinsam mit uns Zukunft zu gestalten.\n\n\
    Wir gestalten Zukunft – gemeinsam\n\n **English Version** \n\nHead of AI Solutions\
    \ & Architecture (m/w/d)\n\n **Kelvion** \n\nOur mission is to lead the industrial\
    \ transformation by championing innovation and sustainability. From optimising\
    \ data centres and advancing hydrogen production to revolutionising refrigeration\
    \ and HVAC systems, our mission-critical thermal solutions empower industries\
    \ around the globe. United as “One Kelvion,” our global team delivers innovative\
    \ solutions that drive customer success and support a sustainable future.  \n\
    \  \nTogether, We Shape the Future\n\n **Job Description** \n\n**Your Responsibilities**\n\
    \n* You define and further develop the enterprise-wide AI architecture as well\
    \ as the strategic AI roadmap.\n* You establish reference architectures, design\
    \ principles, and standards for scalable AI and data-driven solutions.\n* You\
    \ ensure the seamless integration of AI solutions into core enterprise systems\
    \ such as ERP, CRM, MES, and modern data platforms.\n* You develop the AI operating\
    \ model, including platform strategy, MLOps/LLMOps practices, and lifecycle management.\n\
    * You own and govern the AI governance framework, including policies, risk assessment,\
    \ approval processes, and Responsible AI standards.\n* You manage the vendor and\
    \ platform landscape, oversee licensing models, costs, and build-vs-buy decisions.\n\
    * You prioritize the AI use case portfolio, scale solutions from PoC to production,\
    \ and lead the AI team.\n\n**Your Qualifications**\n\n* You hold a degree in Computer\
    \ Science, Information Technology, Engineering, or a related field.\n* You have\
    \ several years of leadership experience in AI, data, cloud, or enterprise architecture\
    \ roles.\n* You possess deep expertise in AI/ML technologies, data platforms,\
    \ and cloud architectures within the Microsoft ecosystem (Azure AI, Copilot, Power\
    \ Platform).\n* You have experience in AI governance, Responsible AI standards,\
    \ and regulatory compliance such as GDPR and the EU AI Act, and you are familiar\
    \ with enterprise and security architecture principles.\n* You bring strong technical\
    \ competence in MLOps/LLMOps, SQL, SAP BW, Microsoft Fabric, and Power BI and\
    \ understand the AI lifecycle end-to-end.\n* You think strategically, communicate\
    \ effectively, and lead complex cross-functional initiatives.\n* Excellent German\
    \ and English skills as well as willingness to travel internationally complete\
    \ your profile.\n\nAt Kelvion we thrive on collaboration, embracing diversity\
    \ of thought, and valuing every voice. Within Kelvion creativity shines because\
    \ people are listened to, their contributions recognised, and their ideas welcomed.\
    \ Our flexible approach to the way we work places people’s health and satisfaction\
    \ as a priority, enhancing engagement and fostering career opportunities. We empower\
    \ engaged individuals to grow, progress and carve their own paths within the company.\n\
    \nTogether, We Shape the Future"
