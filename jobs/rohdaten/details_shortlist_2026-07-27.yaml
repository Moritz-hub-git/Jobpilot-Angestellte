  weitereBerufe:
  - Head of AI Applications (f/m/x)
  stellenangebotsBeschreibung: '### **Ihre Rolle:**


    ### **Technische Führung**


    - Gestalten Sie den zukünftigen AI- und GenAI-Technologiestack bei ZEISS, indem
    Sie modernste Technologien auf die geschäftlichen Anforderungen von ZEISS abstimmen
    – und dabei Skalierbarkeit, Wartbarkeit und Wirtschaftlichkeit sicherstellen

    - Beraten Sie Teams bei Zeiss Digital Partners und darüber hinaus in Bezug auf
    AI- und GenAI-Technologien sowie deren Implementierung


    ### **Lösungsumsetzung**


    - Leiten Sie technische Projektstränge über den gesamten Lebenszyklus hinweg,
    vom Proof of Concept bis hin zu voll funktionsfähigen und skalierten Lösungen
    innerhalb eines agilen Rahmens. Stellen Sie dabei eine qualitativ hochwertige
    und effiziente Entwicklung sicher und halten Sie sich an die ZEISS-Standards (regulatorisch,
    ethisch, sicherheitstechnisch).

    - Entwickeln Sie Best Practices in der Anwendungsentwicklung kontinuierlich weiter
    und treiben Sie Exzellenz bei der Umsetzung voran.

    - Übernehmen Sie die Verantwortung für die Festlegung des Projektumfangs, die
    Budgetierung, die Personalbesetzung und das Stakeholder-Management für technische
    Projektstränge und treiben Sie diese voran.


    ### **Teambefähigung und -entwicklung**


    - Unterstützung der Projektteams durch Beratung, Priorisierung und Problemlösung
    nach Bedarf

    - Befähigung der Teams, damit sie für den Erfolg gerüstet sind und ihre Versprechen
    einhalten können

    - Einschreiten bei Eskalationen oder Konflikten

    - Sicherstellung einer ausgewogenen Arbeitsbelastung und angemessener Aufgabenverteilung

    - Förderung einer Kultur der Innovation, des Lernens und der Inklusion im Einklang
    mit den Unternehmenswerten sowie Aufrechterhaltung einer hohen Motivation der
    Teams


    ### **Kommunikation und Abstimmung mit den Stakeholdern**


    - Förderung einer klaren Kommunikation und klarer Zuständigkeiten zwischen den
    SBUs, den ZDP-Teams und den KI-Experten

    - Sicherstellung, dass alle Projektsponsoren und das kundenseitige Management
    den Umfang, die Risiken und die Grenzen gemeinsamer Projekte/Lösungen durch ein
    klares und effektives Erwartungsmanagement verstehen

    - Sicherstellung, dass alle Teammitglieder den geschäftlichen Kontext und die
    Kundenanforderungen verstehen


    ### **Teamführung**


    - Führung, Motivation, Beurteilung, Steuerung und Weiterentwicklung der Teammitglieder
    gemäß den ZEISS-Prinzipien für Management und Führung

    - Sicherstellung der erforderlichen Qualifikationen der Mitarbeiter

    - Vorschläge für Gehaltsanpassungen und Mitwirkung bei Entscheidungen über individuelle
    Personalmaßnahmen (in Abstimmung mit der Personalabteilung)

    - Umsetzung von Maßnahmen zur effizienten Gestaltung von Strukturen und Prozessen
    im Team


    ### **Ihr Profil:**


    - Ein hervorragender Hochschulabschluss (Promotion von Vorteil) in Naturwissenschaften,
    Mathematik, Informatik, Ingenieurwissenschaften oder ähnlichen Fachbereichen

    - Mehrjährige Berufserfahrung in der Entwicklung und Bereitstellung von KI- und
    GenAI-Anwendungen im Unternehmenskontext

    - Nachgewiesene Fähigkeit, vielfältige Entwicklungsteams zu leiten


    ### **Führung und Entscheidungsfindung**


    - Fähigkeit, in einem schnelllebigen Umfeld mit hoher Unsicherheit und Unklarheit
    klar und deutlich zu führen

    - Erfahrung in der Leitung agiler Entwicklungs- und Produktteams

    - Fähigkeit, die Entwicklungsteams zu befähigen und zu unterstützen, indem Sie
    ihnen bei Bedarf Anleitung, Unterstützung und Priorisierung bieten, damit sie
    effektiv arbeiten können


    ### **Technisches Fachwissen**


    - Tiefgreifendes technisches Verständnis von grundlegenden und großen Sprachmodellen,
    dem Microsoft-KI-Tech-Stack sowie agentenbasierten Frameworks wie LangChain oder
    AutoGen

    - Sehr ausgeprägte technische Fähigkeiten, von der Lösungsarchitektur bis zur
    praktischen Softwareentwicklung (Python, Git, DevOps)


    ### **Geschäftssinn**


    - Fähigkeit, den Hype zu durchschauen und die vielversprechendsten und wirkungsvollsten
    Anwendungsfälle zu identifizieren, während man Störfaktoren ausblendet

    - Ausgeprägter Geschäftssinn und Verständnis für relevante Aspekte von KI- und
    datengesteuerten Geschäftsmodellen

    - Fähigkeit, Kundenbedürfnisse in effektive technische Lösungen umzusetzen


    ### **Soziale und kommunikative Kompetenzen**


    - Aufgeschlossenheit, Flexibilität und nachgewiesene Fähigkeit zur erfolgreichen
    Zusammenarbeit mit interdisziplinären und internationalen Teams – team- und abteilungsübergreifend

    - Ausgeprägte Kommunikations- und Präsentationsfähigkeiten sowie die Fähigkeit,
    Entscheidungsprozesse von der operativen Ebene bis hin zur CxO-Ebene voranzutreiben

    - Fähigkeit, sich sowohl im Unternehmensumfeld als auch in Führungs-, Geschäfts-
    und Technologieumgebungen sicher zu bewegen

    - Flüssiges Englisch und fortgeschrittene Deutschkenntnisse'
