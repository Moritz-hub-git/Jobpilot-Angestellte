  stellenangebotsBeschreibung: "Kurzbeschreibung der Stelle\n • Rolle: Aufbau unserer\
    \ neue Software- und AI-Division und Entwicklung skalierbarer digitaler Geschäftsfelder\n\
    \ • Mission: Transformation zu einem technologiegetriebenen Anbieter intelligenter\
    \ Software-, Plattform- und KI-Lösungen für KMU\n • Impact: Verantwortung für\
    \ den gesamten Lebenszyklus der digitalen Produkte, von der Idee über Entwicklung\
    \ und Markteinführung bis zum wirtschaftlichen Erfolg\n • Arbeitsweise: Verbindung\
    \ von strategischen Denken mit operativer Umsetzung sowie aktive Gestaltung von\
    \ Technologien und Produkten\n\nDiese Aufgaben erwarten DichStrategie & Business\n\
    \ • Entwicklung und Umsetzung der Software- und AI-Strategie\n • Aufbau eines\
    \ skalierbaren Produktportfolios und neuer Geschäftsmodelle\n • Verantwortung\
    \ für Produkt-Roadmap, Budget und Wirtschaftlichkeit\n\nProduktentwicklung\n •\
    \ Verantwortung für den gesamten Produktlebenszyklus\n • Priorisierung von Features\
    \ und Definition technischer Standards\n • Sicherstellung von Qualität, Skalierbarkeit\
    \ und Time-to-Market\n\nEngineering & Architektur\n • Gestaltung moderner Cloud-,\
    \ Web- und App-Architekturen\n • Auswahl und Weiterentwicklung des Tech-Stacks\
    \ sowie Entwicklungsstandards\n • Steuerung externer Entwicklungspartner und Aufbau\
    \ eines internen Engineering-Teams\n\nAI & Innovation\n • Identifikation und Umsetzung\
    \ neuer AI-Anwendungsfälle\n • Integration moderner LLMs, Automatisierungen und\
    \ intelligenter Workflows\n • Bewertung neuer Technologien und Überführung in\
    \ marktfähige Produkte\n\nLeadership\n • Aufbau und Führung einer leistungsstarken\
    \ Engineering-Organisation\n • Recruiting, Coaching und Entwicklung interner Teams\n\
    \ • Etablierung agiler Prozesse und einer modernen Engineering-Kultur\n\nZusammenarbeit\n\
    \ • Enge Zusammenarbeit mit Geschäftsführung, Vertrieb und Marketing\n • Übersetzung\
    \ von Markt- und Kundenanforderungen in digitale Lösungen\n • Steuerung externer\
    \ Technologie- und Entwicklungspartner\n\nDamit begeisterst Du unsMust‑haves \n\
    \ • Mehrjährige Erfahrung in Software Engineering, Softwarearchitektur oder technischem\
    \ Produktmanagement\n • Mehrjährige Führungserfahrung sowie Erfahrung im Aufbau\
    \ von Teams oder digitalen Produkten\n • Fundierte Kenntnisse moderner Web-, Cloud-,\
    \ App- und API-Architekturen (z. B. TypeScript, React, React Native, Supabase,\
    \ GitHub, Vercel)\n • Erfahrung im Einsatz von KI-Technologien, Large Language\
    \ Models und Prozessautomatisierung\n • Erfahrung in der Steuerung externer Entwicklungspartner\
    \ und agiler Softwareprojekte\n\nNice‑to‑haves \n • Erfahrung im Aufbau eines\
    \ SaaS- oder Plattformgeschäfts\n • Kenntnisse in DevOps, CI/CD sowie Cloud-Infrastrukturen\
    \ (Azure, AWS oder Google Cloud)\n • Erfahrung mit AI-Frameworks, Agenten-Systemen\
    \ oder Retrieval-Augmented Generation (RAG)\n • Kenntnisse im B2B-SaaS- oder Plattformgeschäft\n\
    \nArbeitsstil / Mindset \n • Unternehmerisches Denken mit ausgeprägter Ownership\n\
    \ • Hands-on-Mentalität sowie hoher Qualitäts- und Innovationsanspruch\n • Begeisterung\
    \ für neue Technologien und die Fähigkeit, Menschen für Veränderungen zu gewinnen\n\
    \nWenn Du unternehmerisch denkst, gerne Verantwortung übernimmst und Innovation\
    \ in marktfähige Lösungen verwandelst, freuen wir uns darauf, Dich kennenzulernen.\
    \ \n\nÜber uns FLH DIGITAL ist ein etabliertes Unternehmen mit führender und gefestigter\
    \ Marktposition im Bereich Marketing Services im LEH-Segment.Mit klarem Fokus\
    \ auf Innovation und nachhaltiges Wachstum treiben wir aktuell die nächste Entwicklungsstufe\
    \ unseres Unternehmens voran: Durch neue Software- und Serviceprodukte, die Erschließung\
    \ zusätzlicher Marktsegmente sowie die konsequente Internationalisierung.\n\n\
    Wir steigern die Sichtbarkeit kleiner und mittelständischer Unternehmen – messbar,\
    \ nachhaltig und skalierbar."
