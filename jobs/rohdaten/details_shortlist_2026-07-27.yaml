  quereinstiegGeeignet: false
  stellenangebotsBeschreibung: '## Wir setzen auf Leidenschaft für Produktion und
    Vermarktung!


    Wir, die 3C-Gruppe, sind ein leistungsstarker Möbelhersteller mit eigenen Produktionsstätten
    in Europa, die auf dem internationalen Markt agiert. Mit unserem Firmensitz in
    Wiedenbrück sind wir tief mit der Möbelregion Ostwestfalen-Lippe verwurzelt.


    Du bringst Begeisterung für Deinen Beruf mit? Dann bis Du bei uns genau richtig.
    Wir, die 3C Gruppe, sehen uns einer Unternehmenskultur verpflichtet, die auf die
    Ideen unserer Mitarbeiter setzt. Ausdrücklich motivieren wir dazu, im Team neue
    Konzepte zu entwickeln. Wir schaffen ein Klima, in dem das Expertenwissen unserer
    Mitarbeiter anerkannt wird und die Freude an ergebnisorientierter Arbeit im Vordergrund
    steht. Nur so können wir weiterhin als leistungsstarker Möbelhersteller agieren.


    Wenn wir Dich für uns gewinnen können, wirst Du in einem Unternehmen beschäftigt
    sein, welches Bodenständigkeit sowie weltoffenes und weitläufiges Handeln vereint.


    ## Deine Aufgaben


    - **Strategische Orchestrierung:** Du übernimmst die Steuerung der KI-Roadmap
    und überführst das externe Know-how sukzessive in eine schlagkräftige Inhouse-Struktur.

    - **Use-Case-Management:** Du identifizierst und priorisierst Use Cases entlang
    der Wertschöpfungskette, entwickelst Konzepte und begleitest diese bis zum erfolgreichen
    Go-Live.

    - **Hands-on Prototyping:** Du setzt erste Iterationen selbstständig um, bindest
    APIs an und verifizierst technische Machbarkeiten im Zusammenspiel mit der IT.

    - **Enablement & Culture:** Du coachst die internen "KI-Champions" in den Fachbereichen,
    baust Berührungsängste ab und etablierst ein nachhaltiges Trainingskonzept für
    die gesamte Belegschaft.

    - **Erfolgsmessung:** Du definierst klare KPIs (wie User Adoption und Zeitersparnis)
    und trackst den messbaren Business Impact Deiner Projekte.

    - **Berichtslinie:&#160;** Die Position ist als direkte Stabsstelle der Geschäftsführung
    angelegt, mit hohem Gestaltungsspielraum und kurzen Entscheidungswegen.


    ## Dein Profil


    - **Expertise:** Erfahrung an der Schnittstelle zwischen Business und Tech mit
    Fokus auf KI- und Automatisierungsprojekte.

    - **Technisches Fundament:** Du beherrschst professionelles Prompt-Engineering
    und bringst solide Python-Kenntnisse mit, um Prototypen eigenständig zu bauen
    und APIs sowie KI-Tools selbst anzubinden.

    - **Change-Mentalität:** Du verstehst Dich als empathischer Brückenbauer, der
    komplexe Tech-Themen verständlich für das Top-Management und die Fachbereiche
    übersetzt.

    - **Sprachniveau:** Du kommunizierst sicher auf Deutsch (mind. C1) und besitzt
    verhandlungssicheres Englisch für den internationalen Rollout.


    ## Unser Angebot


    - Eine verantwortungsvolle Rolle in einer wachsenden, zukunftsorientierten Organisation

    - Flache Hierarchien, kurze Entscheidungswege und Gestaltungsspielraum

    - Flexible Arbeitszeiten und die Möglichkeit zu teilweise remote Arbeit

    - Berufliche Weiterentwicklung, Schulungen und regelmäßiges Feedback

    - **Der Start:** Individuelles Onboarding im gesamten Betrieb und Schulungen/Einarbeitung
    in die verwendeten Werkzeuge

    - **Unternehmenskultur:** Eine lockere, aber gleichzeitig äußerst professionelle
    Arbeitsatmosphäre, mit Gestaltungsspielraum für eigene Ideen

    - **Menschlichkeit:&#160;**Wir pflegen einen Umgang, der von Respekt und gegenseitiger
    Achtung geprägt ist. Flache Hierarchien, unbürokratisches Miteinander – Das zeichnet
    unser Haus aus

    - **Wohlfühlatmosphäre:** Ein modernes Ambiente mit zeitgemäßen Arbeitsplätzen
    und den passenden Tools

    - **Work Life Balance:** Als familienfreundlicher Arbeitgeber legen wir besonders
    großen Wert auf die gesunde Balance von Karriere und Privatleben (Kinderbetreuung,
    flexible Arbeitszeitgestaltung)

    - **Attraktive Events:** Wir feiern Erfolge mit unseren Mitarbeitern, die ohne
    diese nicht möglich wären

    - **Verpflegung:** Wöchentlich frisches Obst und Gemüse in der Winterzeit, sowie
    täglich kostenlose Tee- und Kaffeespezialitäten und verschiedene Sorten Wasser,
    Zuschuss zum täglichen Mittagessen bei uns im Bistro

    - **Gesundheitsförderung:** Du verbringst einen Gutteil Deiner Lebenszeit am Arbeitsplatz,
    wir tragen unseren Teil dazu bei, dass Du dabei gesund und fit bleibst (SportNavi
    und Altersvorsorgemodelle)

    - **Beständigkeit:** Wir setzen auf eine langjährige Beziehung zu unseren Mitarbeiterinnen
    und Mitarbeitern, denn nur ein eingespieltes Team bringt Top-Leistung

    - **Weiterbildung und Coaching:** Deine Ideen sind unser Kapital

    - **Mobilität:** Wir bieten Bike- Leasing'
