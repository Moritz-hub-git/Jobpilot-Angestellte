    <li>Mitgestaltung unserer Data- und AI-Architektur und technischer Entscheidungen</li>

    </ul>

    <h2>Qualifikation</h2>

    <p><strong>Das bringst du mit:</strong></p>

    <ul>

    <li>Du hast Erfahrung im Data Engineering und/oder im Bereich Machine Learning / KI – ob frisch durchgestartet oder mit
    einigen Jahren auf dem Buckel</li>

    <li>Du bist sicher in Python und im Umgang mit SQL und Datenbanken</li>

    <li>Du hast Erfahrung mit dem Aufbau von Datenpipelines (ETL/ELT) und arbeitest strukturiert mit größeren Datenmengen</li>

    <li>Erfahrung mit ML-Frameworks und/oder LLMs ist ein Plus</li>

    <li>Du arbeitest selbstständig, denkst mit und übernimmst gerne Verantwortung</li>

    <li>Lust, dich in eine komplexe Fachdomäne (medizinische Abrechnung) einzuarbeiten</li>

    <li>Du sprichst fließend Deutsch und hast gute Englischkenntnisse</li>

    </ul>

    <h2>Benefits</h2>

    <p><strong>Das bieten wir:</strong></p>

    <ul>

    <li>Office direkt am Marienplatz</li>

    <li>Ein junges, dynamisches Team, das eng vor Ort zusammenarbeitet</li>

    <li>Flexible Arbeitszeiten mit Raum für Home-Office</li>

    <li>Moderne Hardware deiner Wahl (z. B. MacBook)</li>

    <li>Direkter Draht zu echten Nutzer:innen und sichtbarer Impact ab Tag eins</li>

    <li>Fitnessabo (Wellpass) und attraktive Corporate Benefits</li>

    <li>Viel Verantwortung und die Chance, unser Produkt von Grund auf mitzugestalten</li>

    </ul>

    <p><strong>Du kannst es kaum erwarten? Wir auch nicht!</strong></p>

    <p>Spar dir das klassische Anschreiben – wir wollen sehen, was du baust. Schick uns deinen Lebenslauf und, wenn du magst,
