  beschreibung: '<h2>1KOMMA5°</h2>

    <p>At <strong>1KOMMA5°</strong>, we pursue a clear vision: <strong>Living on wind and sunlight forever for free</strong>.
    To make this a reality, we are building the energy system of the future with Heartbeat AI. Want to be part of it?</p>

    <p>We bring together regional craftsmanship and scalable software: We don''t think of solar, batteries, heat pumps, and
    e-mobility as isolated components, but control them as an intelligent, integrated overall system in our virtual power
    plant. Directly connected to the electricity market – in real time, fully automated. This way, energy is used when it
    is available from renewables and particularly cost-effective. By 2030, our goal is to transition 1.5 million households
    to renewable energies. Over 3,000 people are working towards this every day, at more than 80 locations worldwide, from
    Finland to Australia.</p>

    <p><strong>Want to take responsibility and build solutions that truly matter? Apply now and help us shape the energy world
    of tomorrow.</strong></p>

    <p>Learn about our Product & Tech team!</p>

    <h2>Deine Position</h2>

    <p>As part of one or two cross-functional mobile product teams, you will own the quality of our Flutter apps, and change
    how we approach testing.<br>

    AI-driven QA is the differentiator in this role. Our QA team already uses AI for test generation, but we want to go much
    further. You will help invent this from scratch: autonomous exploration, smarter test orchestration, self-directed QA
    workflows, and QA systems that detect product risks before they reach users.<br>

    This is not a "write test cases and file tickets" role. You co-own product quality end-to-end, tell engineering teams
    where the gaps are, and build the systems and practices that let us ship with confidence. Faster, not slower.<br>

    You think about quality as something you design into the product and process, not a checklist you run before release.</p>

    <h2>Our Stack</h2>

    <ul>

    <li>Flutter & TypeScript</li>

    <li>Appium, BrowserStack</li>

    <li>Testmo for test case management</li>

    <li>GCP, GitHub Actions, Datadog</li>

    <li>AI-assisted development with Cursor and agentic coding workflows</li>

    <li>Linear, Notion, Figma, Miro</li>

    </ul>

    <h2>Key Responsibilities</h2>

    <ul>

    <li>Own quality across our mobile products end-to-end: test strategy, execution, and production monitoring</li>

    <li>Work embedded in one or two cross-functional product teams and shape quality practices with engineers, product, and
    design</li>

    <li>Find the gaps in our current testing approach and close them</li>

    <li>Grow and maintain our automated test suite (Appium / BrowserStack). Keep it fast, stable, trusted, and focused on
    critical user journeys</li>

    <li>Advise engineers on testing strategy and testability early, at the design stage, not after the build</li>

    <li>Push AI-driven QA beyond test generation: bring in autonomous exploratory testing, intelligent orchestration, and
    self-directed testing workflows</li>

    <li>Build QA feedback loops that are tightly integrated with development. Quality should be a real-time signal, not a
    gate at the end</li>

    <li>Keep test infrastructure healthy: less flakiness, faster runs, results the whole team can act on</li>

    <li>Use AI tools wherever they make you and the team more effective, and figure out where autonomous QA can reduce repetitive
    manual work while preserving human judgment where it matters</li>

    </ul>

    <h2>Dein Profil</h2>

    <ul>

    <li>5+ years of QA experience across manual testing, automation, and test strategy.</li>

    <li>Hands-on experience with mobile test automation (Appium or comparable) and cloud device farms (BrowserStack or similar)</li>

    <li>Experience integrating automated testing into CI/CD pipelines (we use GitHub Actions) and using quality signals to
    support rapid, reliable releases</li>

    <li>Strong understanding of mobile application architecture, client-server interactions, and API integrations, with a
    feel for common mobile failure patterns</li>

    <li>You understand the SDLC and can design test strategies around how complex products fail</li>

    <li>Practical experience leveraging AI in QA workflows such as exploratory testing, test case design, defect analysis,
    and autonomous testing agents. Or you have a clear vision for it and can show you''ve been building in that direction</li>

    <li>You care about user journeys and real-world scenarios, not just code coverage numbers</li>

    <li>Comfortable with ambiguity. You figure out the path forward when there''s no playbook</li>

    <li>Clear communicator in written and spoken English

    Bonus points for:</li>

    <li>German language skills</li>

    <li>Experience with energy systems, IoT, or climate tech</li>

    <li>Startup or scale-up experience</li>

    <li>Hands-on experience with LLMs or AI agents in a QA or DevEx context</li>

    </ul>

    <h2>Benefits</h2>

    <ul>

    <li>You are part of an international, dynamic, and highly motivated team of people who have proven to make things happen</li>

    <li>With your work, you accelerate the "energy transition" and hence have a direct impact on our climate</li>

    <li>Work with and learn from other super-smart colleagues</li>

    <li>You will enjoy direct contact with core decision-makers</li>

    <li>You will enjoy the best chances of entering full-time in one of Europe’s most thriving scaleups</li>

    <li>You work remotely (Germany-wide), with offices in Hamburg, Berlin or Munich</li>

    <li>Create a healthy balance alongside your work and enjoy all the benefits of the EGYM Wellpass</li>

    <li>Benefits and discounts are yours with Futurebens</li>

    <li>Whether city bike or e-bike - be flexible with our job bike leasing and do something good for the environment at the
