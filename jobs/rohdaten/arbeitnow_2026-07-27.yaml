- slug: engineering-manager-edge-ai-berlin-258996
  titel: Engineering Manager - Edge AI
  firma: SumUp
  ort: Berlin, Berlin, Germany
  remote: false
  tags: []
  url: https://www.arbeitnow.com/jobs/companies/sumup/engineering-manager-edge-ai-berlin-258996
  beschreibung: '<p>Our AI Platform & Edge team sits at the heart of how SumUp is scaling intelligent, merchant-facing experiences
    across millions of interactions. We build and operate the AI systems — from LLM-powered assistants to agentic platforms
    — that directly shape how merchants get support, resolve issues, and engage with SumUp''s products. As Engineering Manager
    for Edge, you''ll take ownership of a growing, cross-functional team of engineers and ML specialists, leading the execution
    of some of our most technically complex and commercially critical AI initiatives. This is a rare opportunity to lead meaningful
    AI work at scale — not just shipping features, but shaping how an entire platform evolves.</p>

    <h2>What you''ll do</h2>

    <ul>

    <li>

    <p>Lead the day-to-day execution of the Edge AI team, translating long-term product vision into clear sprint roadmaps
    and measurable delivery milestones</p>

    </li>

    <li>

    <p>Own the migration of our AI assistant to an autonomous agentic setup, maintaining performance while expanding AI support
    across all merchant-facing channels</p>

    </li>

    <li>

    <p>Set the technical direction for LLM-powered system design, making clear tradeoffs across quality, latency, and cost</p>

    </li>

    <li>

    <p>Build a data-informed engineering culture by defining performance metrics, tracking delivery velocity, and using insights
    to continuously improve team health and throughput</p>

    </li>

    <li>

    <p>Hire, mentor, and develop a team of engineers and ML specialists — including interns — creating an environment where
    people grow and do their best work</p>

    </li>

    </ul>

    <h2>You''ll be great for this role if…</h2>

    <ul>

    <li>

    <p>Strong hands-on background in ML/AI engineering or data science, with experience leading a team delivering production
    AI products</p>

    </li>

    <li>

    <p>Deep technical knowledge of LLM-powered system design, including RAG, embeddings, tool/function calling, and orchestration
    frameworks such as LangChain or LlamaIndex</p>

    </li>

    <li>

    <p>Proficiency in Python and core AI/ML libraries, including PyTorch and HuggingFace Transformers, with solid LLMOps/MLOps
    and CI/CD practices</p>

    </li>

    <li>

    <p>Proven track record of launching AI features end-to-end in production — from problem framing and prototyping through
    to reliable, measurable delivery</p>

    </li>

    <li>

    <p>Ability to lead with clarity, empathy, and accountability — building inclusive, high-performing teams while navigating
    ambiguity and managing stakeholders across technical and non-technical domains</p>

    </li>

    </ul>

    <h2>Why you should join SumUp</h2>

    <ul>

    <li>

    <p>🌎 Opportunity to work with SumUppers globally on large-scale fintech products used by millions of businesses worldwide,
    from our Berlin office. This involves an office-first setup</p>

    </li>

    <li>

    <p>🌈 Commitment to Diversity and Inclusion: be part of a workplace that values and promotes diversity, fostering an inclusive
    environment where everyone''s perspectives are respected and embraced</p>

    </li>

    <li>

    <p>🚀 Enrolment onto our Virtual Stock Option programme: you will own a stake in SumUp''s future success</p>

    </li>

    <li>

    <p>📚 A dedicated annual L&D budget of €2000 for your individual development, which can be used to attend conferences and/or
    advance your career through further education</p>

    </li>

    <li>

    <p>💶 A corporate pension scheme where we match up to 20% of your contributions</p>

    </li>

    <li>

    <p>🏖 Generous time off: enjoy 28 days of paid leave plus public holidays and special leave days</p>

    </li>

    <li>

    <p>🏙 Numerous other benefits such as Urban Sports Club subsidy, Kita placement assistance, subsidised office lunches</p>

    </li>

    <li>

    <p>🌴 Break4me: 1-month sabbatical after 3 years of service</p>

    </li>

    <li>

    <p>🔗 Referral Bonus: earn additional rewards by referring talented individuals to join the SumUp team</p>

    </li>

    </ul>

    <h2>About SumUp</h2>

    <p>Be empowered to do more that matters.</p>

    <p>At SumUp, we''re on a mission to empower small businesses across the globe by providing simple and affordable tools
    that allow them to thrive. Today, over 4 million businesses in 37 markets rely on SumUp as their financial partner to
    manage payments, finance and customer relationships.</p>

    <p>Our commitment to small businesses is reflected in <a href="https://youtu.be/9DG64C3moeQ?si=YpcWuBNBTOQPzeLI" target="_blank">our
    diverse team</a> of over 3,000 SumUppers from over 90 nationalities, united by global collaboration and an innovative
    mindset. <a href="https://www.sumup.com/careers/culture/" target="_blank">Our core values</a> lay the foundation for who
    we are and what we stand for, shaping our work culture and driving our success. We foster inclusivity and a continuous
    learning culture, providing a safe space for personal and professional growth. Our differences make us unique and strong
    as we strive to create an environment where everyone belongs and feels supported, no matter how they identify.</p>

    <p>SumUp is proud to be an Equal Employment Opportunity employer, actively seeking and embracing diversity in our workforce.
    We don''t make hiring or employment decisions based on race, colour, religion or religious belief, ethnic or national
    origin, nationality, sex, gender, gender identity, sexual orientation, disability, age or any other basis protected by
    applicable laws or prohibited by company policy. Our commitment extends beyond recruitment to creating a safe and respectful
    workplace where harassment of any form is strictly prohibited. Discover more about our culture and opportunities on our
    <a href="https://www.sumup.com/careers/" target="_blank">careers website</a>, and follow our journey on <a href="https://www.linkedin.com/company/sumup/"
    target="_blank">LinkedIn</a>, <a href="https://www.instagram.com/insidesumup/" target="_blank">Instagram</a>, and <a href="https://www.tiktok.com/@insidesumup"
    target="_blank">TikTok</a>.</p><div class="content-conclusion"><p><strong>Job Application Tip</strong></p>

    <p><span style="font-weight: 400;">We recognise that candidates feel they need to meet 100% of the job criteria in order
    to apply for a job. Please note that this is only a guide. If you don''t tick every box, it''s ok too because it means
    you have room to learn and develop your career at SumUp.</span></p></div><p>Find <a href="https://www.arbeitnow.com">Jobs
    in Germany</a> on Arbeitnow</a>'
