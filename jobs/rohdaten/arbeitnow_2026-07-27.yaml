  url: https://www.arbeitnow.com/jobs/companies/heidi-systems/founders-associate-ai-process-optimisation-intern-fulltime-berlin-268267
  beschreibung: '<p>Berlin based | German native speaker | Vollzeit – Praktikum oder Festanstellung</p>

    <p><strong>Über uns</strong></p>

    <p>Heidi Systems baut das Energy-OS für Real Estate. Dafür digitalisieren wir einen der letzten großen analogen Märkte
    Europas und schaffen die Infrastruktur für intelligentes Energiemanagement in Gebäuden.</p>

    <p>Wo wir stehen:</p>

    <ul>

    <li>8 Personen</li>

    <li>Starke Pipeline mit +5.000 aktiven Deals</li>

    <li>Angel-Runde mit Unicorn-Foundern sowie Directors von Google und OpenAI</li>

    <li>Auf dem Weg zu 10x in 2026</li>

    </ul>

    <p>Wir rollen die Messdienstbranche neu auf – einen riesigen, verstaubten Markt, den seit Jahrzehnten kaum jemand angefasst
    hat. Als Prop- und ClimateTech verbinden wir Software, IoT und Operations zu einer Plattform, die Energie- und Verbrauchsdaten
    erstmals durchgängig digital, transparent und in Echtzeit verfügbar macht. So schaffen wir die Grundlage für eine intelligente
    und effiziente Energieinfrastruktur von Gebäuden.</p>

    <p>Wir wachsen stark und haben gerade unsere Angel-Runde erfolgreich abgeschlossen. Zu unseren Investoren gehören unter
    anderem Unicorn-Gründer sowie Directors von Google und OpenAI.</p>

    <p>Als <strong>Founder''s Associate mit Fokus auf AI & Process Optimisation</strong> arbeitest du direkt mit unserem Founder
    Paul zusammen. Du sitzt mit uns am Tisch, übernimmst vom ersten Tag an Verantwortung und treibst eigenständig Projekte
    voran, die unsere internen Prozesse skalierbarer, transparenter und effizienter machen. Dabei nutzt du AI, Automatisierung
    und den passenden Tool-Stack, um die Grundlage für unser weiteres Wachstum zu schaffen.</p>

    <h2>Aufgaben</h2>

    <ul>

    <li>Du identifizierst manuelle und repetitive Abläufe, entwickelst AI-gestützte Lösungen und implementierst No-Code-/Low-Code-Automationen
    (z. B. n8n, Make, Zapier, Claude Code), um unsere operative Effizienz messbar zu steigern.</li>

    <li>Du baust mit uns ein AI- und toolgestütztes Operating Model auf, das unsere Organisation für schnelles Wachstum skalierbar
    macht.</li>

    <li>Du fungierst als Bindeglied zwischen Geschäftsführung, Sales, Operations und Tech – analysierst Anforderungen, strukturierst
    Prozesse und setzt skalierbare Lösungen gemeinsam mit den relevanten Teams um.</li>

    <li>Du entwickelst aus operativer Komplexität klare Workflows, Automationen und digitale Strukturen, die unser Team schneller
    und effizienter machen.</li>

    <li>Du optimierst CRM-, Operations- und Datenflüsse und stellst sicher, dass Informationen effizient erfasst, verarbeitet
    und teamübergreifend nutzbar gemacht werden.</li>

    </ul>

    <h2>Qualifikation</h2>

    <p><strong>Wie du tickst</strong></p>

    <ul>

    <li>Du hast Bock, dich zu beweisen – nicht irgendwann, sondern jetzt</li>

    <li>Schnelle Auffassungsgabe und Ownership-Mentalität: Du brauchst Kontext, keine Anleitung – und ziehst Aufgaben sauber
    und mit Auge fürs Detail durch</li>

    <li>Eigeninitiative ist dein Default – du wartest nicht auf Ansagen und arbeitest dich eigenständig in neue Themen, Tools
    und Prozesse ein</li>

    <li>Du nimmst dich selbst ernst: Sport und persönliches Wachstum sind für dich kein Nice-to-have</li>

    </ul>

    <p><strong>Was du mitbringst</strong></p>

    <ul>

    <li>Sehr gute Low-Code- oder No-Code-Skills und hohe Tool-Affinität mit Erfahrung in <a href="http://Make.com">Make.com</a>,
    n8n, Zapier, Supabase oder vergleichbaren Tools</li>

    <li>Laufendes oder abgeschlossenes Studium in einem technischen Bereich (z. B. Informatik, Data Science, Wirtschaftsingenieurwesen)
    oder in Wirtschaftswissenschaften/Immobilienwirtschaft mit hoher Technikaffinität, um zum Experten der digitalen Heidi
    Prozesslandschaft zu werden</li>

    <li>Idealerweise 2+ relevante Praktika und/oder Berufserfahrung in Rollen mit Fokus auf AI, Automatisierung, Data, Product
    Ops oder Process Excellence – idealerweise in einem Startup, Tech-Unternehmen oder der Unternehmensberatung</li>

    <li>Gute Coding-Kenntnisse (z. B. Python, SQL) oder Erfahrung mit APIs und Datenbankstrukturen sind ein großes Plus</li>

    <li>Hohe intrinsische Motivation und starkes unternehmerisches Denken mit der Fähigkeit, eigene Projekte proaktiv voranzutreiben,
    schnell zu lernen, Verantwortung für vielfältige Aufgaben zu übernehmen und mit Unklarheiten umzugehen</li>

    <li>Starke analytische und konzeptionelle Fähigkeiten kombiniert mit einem guten Gespür für operative Realität – du denkst
    in Systemen, nicht nur in Ideen</li>

    <li>Interesse oder erste Erfahrung in Immobilien, PropTech, ClimateTech oder Energy sind ein Plus</li>

    <li>Deutsch auf Muttersprachniveau (nicht verhandelbar) sowie fließende Englischkenntnisse</li>

    </ul>

    <h2>Benefits</h2>

    <ul>

    <li>Direkte Zusammenarbeit und tägliches Mentoring durch einen erfahrenen Gründer und eine extrem steile Lernkurve</li>

    <li>Teil eines stark wachsenden Early-Stage-Startups zu werden, das einen riesigen Markt digitalisiert – mit viel Eigenverantwortung,
    hoher Geschwindigkeit und echtem Gestaltungsspielraum</li>

    <li>Die Chance, echten Impact zu erzielen – an einem der größten, aber oft unterschätzten Hebel der Energiewende: Mit
    digitalen Messdienstleistungen schaffen wir die Grundlage für effizientere Gebäude und messbare CO₂-Einsparungen</li>

    <li>Bei sehr guter Performance besteht eine klare Übernahmeoption und die Möglichkeit, Heidi als einer der ersten 20 Mitarbeitenden
    langfristig mit aufzubauen</li>

    <li>Ein High-Performance-Team in einer humorvollen und unterstützenden Kultur, mit regelmäßigen Team-Dinnern und gemeinsamen
    Events</li>

    <li>Ein neu renoviertes Altbau-Office in Berlin Mitte direkt am Monbijoupark, gemeinsames Arbeiten an einem Tisch, kurze
    Wege und direkte Entscheidungen</li>

    <li>Zugang zu einem starken Netzwerk in Immobilien, Tech, Energie und Venture Capital</li>

    </ul>

    <p><strong>Wie sich deine Rolle beispielhaft entwickeln kann</strong></p>

    <ul>

    <li><strong>Monat 1:</strong> Onboarding in unsere digitale Systemlandschaft, erste eigene Automationen und Workflows
    live bringen</li>

    <li><strong>Monat 2-3:</strong> Breitere Verantwortung über unsere digitale Infrastruktur – einige Automations und Prozesse
    sind bereits live, dein Operating Model nimmt Form an</li>

    <li><strong>Monat 4–12:</strong> Volles Ownership über große Teile unserer digitalen Prozesslandschaft – wer überzeugt,
    bekommt ein Fulltime-Offer und baut Heidi als Festangestellter langfristig mit auf</li>

    <li><strong>12+ Monate:</strong> Wir erkennen Leistung und belohnen sie – wer die Reife mitbringt, übernimmt erste Teamverantwortung,
    wächst in eine Führungsrolle und gestaltet Heidi aktiv mit</li>

    </ul>

    <p>Je nach Erfahrung ist ein Einstieg als Founder''s Associate mit Fokus auf AI & Process Optimisation in Form eines <strong>Praktikums
    (3-12 Monate) oder in Festanstellung</strong> möglich. <strong>Start ab sofort</strong> bzw. auf rolling basis.</p>

    <p>Wir halten den Prozess bewusst unkompliziert: <strong>CV + LinkedIn, kein Anschreiben nötig.</strong></p>

