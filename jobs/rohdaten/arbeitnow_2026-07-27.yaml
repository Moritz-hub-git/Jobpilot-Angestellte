    baust das Eval-Framework (Golden Datasets, Fehlerraten pro Belegtyp und Prozessschritt) und hebst die Quote Jahr für Jahr.
    Du entscheidest datenbasiert, ab welcher Fehlerrate ein Schritt ohne Human-Review läuft.</li>

    <li><strong>Data-Flywheel:</strong> Du sorgst dafür, dass jede menschliche Korrektur strukturiert erfasst wird und automatisiert
    in Evaldaten und Modellverbesserung zurückfließt.</li>

    <li><strong>Integrationen:</strong> Du bindest externe Systeme per API an (DATEV, Banking, später Register- und Verwahrstellen)
