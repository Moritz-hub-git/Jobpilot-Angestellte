    <p>Healthcare is broken. Das wollen wir ändern, und dafür suchen wir Dich!</p>

    <p>Als Data & AI Engineer baust du das datenseitige Rückgrat von MediPulse. Du entwickelst die Pipelines, die medizinische
    Abrechnungsdaten aus unterschiedlichsten Praxissystemen verarbeiten, und bringst KI dort zum Einsatz, wo sie echten Mehrwert
    schafft: bei der Analyse, Automatisierung und Optimierung der Abrechnung. Kurz: Du machst aus rohen Daten die Intelligenz,
    die unser Produkt einzigartig macht.</p>

    <p>MediPulse ist ein dynamisches HealthTech Startup, das Arztpraxen endlich ins 21. Jahrhundert bringt. Wir revolutionieren
    den Gesundheitssektor mit unserer innovativen Software, die Ärzten hilft, ihre Praxen effizienter zu steuern.</p>

    <p>In unserem kleinen, aber hochmotivierten Team kannst du viel Verantwortung übernehmen und arbeitest direkt mit unseren
    erfahrenen Kolleg:innen (ex-McKinsey, ex-BCG) an Themen, die echten Impact haben. Unser Entwicklerteam bringt durchweg
    5+ Jahre Erfahrung mit – du arbeitest von Tag eins mit Leuten auf Augenhöhe. Wenn du Lust hast, richtig was zu bewegen,
    dann bist du bei uns genau richtig!</p>

    <h2>Aufgaben</h2>

    <p><strong>Das erwartet dich:</strong></p>

    <ul>

    <li>Entwicklung und Betrieb robuster Datenpipelines für die Verarbeitung medizinischer Abrechnungs- und Praxisdaten</li>

    <li>Integration und Aufbereitung unterschiedlichster Datenquellen aus Praxisverwaltungssystemen</li>

    <li>Entwicklung und Einsatz von KI-/ML-Modellen zur Analyse, Automatisierung und Optimierung von Abrechnungsprozessen</li>

    <li>Aufbau sauberer Datenmodelle und Sicherstellung von Datenqualität und -integrität</li>

    <li>Enge Zusammenarbeit mit Produkt und echten Praxen, um datengetriebene Features von der Idee bis zum Live-Deployment
