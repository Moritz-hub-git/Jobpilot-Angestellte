    wir immer wieder neue Kolleg:innen, die mit ihren Ideen, ihrem Können und Engagement etwas bewegen wollen. Fühlst du dich
    angesprochen? Dann gestalte Deine Welt zum Besseren und werde Teil unseres Customer Cluster Environment, Transportation
    & Energy.</p><p style="min-height: 1.7em;"></p><h3><span style="color:#a9c23f">DEINE MISSION</span></h3><p>Als AI Solution
    Architect (m/w/d) gestaltest du die KI-/ML-Gesamtarchitektur für komplexe Enterprise-Umgebungen auf Azure. Du verbindest
    fundiertes Know-how in ML-Engineering, RAG-Architekturen und MLOps mit einem starken Verständnis für Governance, Compliance
    und technische Führung. Damit trägst du dazu bei, KI-Lösungen produktionsreif, skalierbar und regelkonform umzusetzen.</p><p
    style="min-height: 1.7em;"></p><p>Deine Aufgaben:</p><ul><li><p>Entwurf und Weiterentwicklung der KI-/ML-Gesamtarchitektur
    auf Azure als Enterprise-KI-Plattform</p></li><li><p>Technische Leitung von ML-Pipeline-Projekten, insbesondere in den
    Bereichen Training, Deployment, Monitoring und Drift Detection, sowie Konzeption und Optimierung von RAG-Architekturen,
    beispielsweise hinsichtlich Chunking, Retrieval, Guardrails und Context Orchestration</p></li><li><p>Definition von MLOps-Strategien
    einschließlich CI/CD für Modelle, Experiment-Tracking und Model Registry</p></li><li><p>Technische Führung und Koordination
    eines interdisziplinären Teams aus ML/AI Engineers, LLM Engineers und MLOps Engineers</p></li><li><p>Beratung zu AI Governance,
    Responsible AI und EU-AI-Act-Compliance sowie Stakeholder-Management durch Architekturpräsentationen gegenüber IT-Leitung
    und Fachbereichen</p></li></ul><p style="min-height: 1.7em;"></p><h3><span style="color:#A9C23F">DAS IST UNS WICHTIG</span></h3><ul
    class="text-element-body_text"><li><p>Fundierte Erfahrung mit Azure-basierten KI-/ML-Lösungen, insbesondere mit Azure
    Machine Learning und Azure OpenAI Service; Kenntnisse weiterer Azure AI Services sind von Vorteil. Darüber hinaus bringst
    du praktische Erfahrung mit MLOps-Konzepten und entsprechenden Werkzeugen mit, beispielsweise MLflow, Kubeflow oder Azure
    ML Pipelines.</p></li><li><p>Erfahrung im Aufbau von RAG-Architekturen, im Prompt Engineering und im Umgang mit Vektordatenbanken
    sowie Kenntnisse in der Integration von Sprachmodellen über APIs. Erfahrung mit Orchestrierungsframeworks wie LangChain
    oder LlamaIndex ist von Vorteil.</p></li><li><p>Erfahrung mit CI/CD für ML-Anwendungen sowie sichere Python-Kenntnisse.
    Praktische Erfahrung mit mindestens zwei gängigen Machine-Learning-Frameworks, beispielsweise scikit-learn, PyTorch oder
    TensorFlow.</p></li><li><p>Erfahrung im Aufbau von Enterprise-Architekturen in Cloud-Umgebungen. Kenntnisse in angrenzenden
    Bereichen wie Datenplattformen, Containerisierung, Container-Orchestrierung, Infrastructure as Code und Observability
    sind von Vorteil, beispielsweise mit Databricks, Azure Data Factory, Azure Data Lake, Docker, Kubernetes, Terraform, Prometheus,
    Grafana oder Application Insights.</p></li><li><p>Verständnis für Governance-, Sicherheits- und Compliance-Anforderungen
    in regulierten Umgebungen. Kenntnisse relevanter Standards und Regelwerke wie ISO 27001, NIS2, BSI-Vorgaben oder dem EU
    AI Act sowie entsprechender Governance-Werkzeuge sind von Vorteil.</p></li><li><p>Mehrjährige Erfahrung mit ML-/AI-Architekturen
    oder vergleichbaren technischen Aufgaben in Enterprise-Umgebungen.</p></li><li><p>Erfahrung in einer technischen Leitungs-
    oder Architekturrolle ist wünschenswert; einschlägige Azure-Zertifizierungen sind ein Plus.</p></li><li><p>Idealerweise
    Erfahrung in der Energiebranche oder Versorgungswirtschaft, mit Predictive Maintenance, Zeitreihenanalysen oder öffentlichen
    Vergabeverfahren wie VgV und EVB-IT.</p></li><li><p>Sehr gute Deutschkenntnisse (Muttersprach-Niveau) sowie gute Englischkenntnisse</p></li></ul><p
    style="min-height: 1.7em;"></p><h3><span style="color:#A9C23F">DEIN NEUER ARBEITSPLATZ</span></h3><ul class="text-element-body_text"><li><p>Was
    bei uns zählt? Klar definierte Rollen, echtes Miteinander und ein gemeinsames Ziel. Wir nennen das Responsiveness – transparent,
    wertschätzend und zielorientiert.</p></li><li><p>Hier bist du am Wandel direkt beteiligt, wenn du möchtest. – Nimm Teil
    an Projekten, die uns als Unternehmen weiterentwickeln.</p></li><li><p>Flexible Arbeitszeiten und Remote Work? – Sind
    selbstverständlich.</p></li><li><p>Individuelles Hardware-Budget? – Stell dir deinen Arbeitsplatz so zusammen, wie du
    dich am wohlsten fühlst.</p></li><li><p>Mental Health? – Dein mentales Wohlbefinden ist uns wichtig. Mit OpenUp unterstützen
    wir dich und bieten dir jederzeit kostenlosen Zugang zu professioneller psychologischer Unterstützung.</p></li><li><p>Individuelles
    Weiterbildungsbudget? – Egal ob die nächste Zertifizierung oder ein lang ersehnter Sprachkurs – du entscheidest, worin
    und wann du dich weiterbildest.</p></li><li><p>Mitarbeiter:innen-PC-Programm? – Lease dir dein nächstes Device zur rein
    privaten Nutzung einfach über virtual7.</p></li><li><p>JobRad oder Firmenwagen? – Wir helfen dir dabei, so mobil zu sein,
