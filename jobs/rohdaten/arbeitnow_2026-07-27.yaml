  tags: []
  url: https://www.arbeitnow.com/jobs/companies/sumup/senior-data-science-ml-engineer-financial-crime-berlin-119994
  beschreibung: '<div data-testid="markdown-response">

    <h3><strong>Team description</strong></h3>

    <p>The Risk AI Engineering Squad is a cross-functional team within the Risk & Compliance tribe,  responsible for developing
    cutting-edge data products and ML solutions that power Transaction Monitoring and protect our merchant base from Money
    Laundering and Financial Crime. We combine automation, AI, and engineering excellence to build innovative products that
    empower Risk and AML teams to work smarter, faster, and more efficiently.</p>

    <p>The <strong>Senior Data Scientist</strong> role is critical to advancing our transaction monitoring capabilities through
    <strong>machine learning, feature engineering, and scalable model pipelines. </strong>You will work across the full model
    lifecycle — from typology understanding and <strong>data exploration</strong> to <strong>feature development, training,
    validation, deployment, and monitoring </strong>— helping ensure our Risk and AML controls remain effective, auditable,
    and compliant across products and markets.</p>

    <p>We actively welcome applications from women and people from underrepresented backgrounds. Diverse perspectives make
    our team stronger and our systems more robust. If you''re motivated by technical depth, real-world impact, and the challenge
    of making ML work reliably in a high-stakes environment, this role is built for you.</p>

    <p><strong>Join us to shape the future of financial safety and make a lasting impact!</strong></p>

    <h2><strong>What you''ll do</strong></h2>

