    und unterstütze uns dabei, Sustainability Manager mit modernen ML- und LLM-basierten Systemen in ihrem Arbeitsalltag zu
    entlasten. Du wirkst am Aufbau von KI-Komponenten, Datenpipelines und Modellierungslogiken mit, die unseren Kunden dabei
    helfen, fundierte und nachhaltige Entscheidungen zu treffen.</p><br><strong>DEIN VERANTWORTUNGSBEREICH</strong><p><ul><li>Du
    unterstützt die Entwicklung unserer KI-Systeme (u. a. LLM-basierte Ansätze, Embeddings und Retrieval-Methoden), um Carbon
    Footprints und weitere Nachhaltigkeitskennzahlen präzise zu berechnen.</li><li>Du entwickelst und optimierst Python-Code
    für Datenpipelines, die unsere Emissionsfaktor-Datenbank in bestehende Systeme integrieren.</li><li>Du arbeitest mit SQL,
    um Daten zu analysieren, zu validieren und für den Einsatz in Machine-Learning-Modellen aufzubereiten.</li><li>Du unterstützt
    bei der Datenmodellierung sowie der Automatisierung von Bilanzierungsmethoden und sorgst dafür, dass diese den aktuellen
    Standards entsprechen.</li><li>Du unterstützt unsere Product Owner und das Machine-Learning-Team bei kundenspezifischen
    Recherchen, Prototypen und Modellierungsaufgaben.</li></ul></p><br><strong>DAS BRINGST DU MIT </strong><p><ul><li>Du bist
    aktuell in einem Bachelor- oder Masterstudium der Informatik, Data Science, Mathematik, Physik oder eines vergleichbaren
    Studiengangs eingeschrieben und hast noch mindestens ein Jahr Studienzeit vor dir.</li><li>Du verfügst über gute Python-Kenntnisse
    und ein solides Verständnis der Grundlagen des Machine Learnings (z. B. Modelltraining, Evaluation und gängige Algorithmen).
    Welches Framework du bisher genutzt hast, ist für uns weniger entscheidend als dein grundlegendes Verständnis.</li><li>Du
    hast bereits mit Large Language Models (LLMs) gearbeitet oder eigene Projekte umgesetzt (z. B. mit Prompting, RAG-Systemen
    oder Embeddings) und möchtest dieses Wissen in der Praxis weiter vertiefen.</li><li>Du bringst gute SQL-Kenntnisse für
    Datenanalysen und ETL-Prozesse mit.</li><li>Du interessierst dich für Nachhaltigkeitsthemen. Erste Erfahrungen im CO₂-Accounting
    (z. B. nach GHG Protocol oder ISO-Standards) oder mit Emissionsfaktor-Datenbanken (z. B. ecoinvent oder GaBi) sind von
    Vorteil, aber kein Muss.</li><li>Du verfügst über sehr gute Englischkenntnisse in Wort und Schrift.</li><li>Du kannst
    uns an 2–3 Tagen pro Woche unterstützen.</li></ul>Du bist begeistert von der Position, erfüllst aber nur 80 % der Anforderungen?
    Bewirb dich trotzdem! Deine Leidenschaft und Motivation für die Aufgabe zählen für uns mehr als Perfektion.</p><br><strong>DAS
    ERWARTET DICH!</strong><p><span style="font-family:Inter, '-apple-system', 'system-ui', 'Segoe UI', Roboto, 'Helvetica
    Neue', 'Open Sans', 'system-ui', '-apple-system', 'Segoe UI', Roboto, Ubuntu, Cantarell, 'Noto Sans', sans-serif, 'Apple
