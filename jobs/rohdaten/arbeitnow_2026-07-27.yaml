  url: https://www.arbeitnow.com/jobs/companies/mindskills/praktikant-marketing-automation-mit-ki-in-remote-homeoffice-cologne-445496
  beschreibung: '<p>Unsere Mission ist es Menschen zu helfen negative Gewohnheiten aufzuhören und durch positive neue Gewohnheiten
    zu ersetzen. Dabei kommen innovative und neu entwickelte Methoden aus der Psychologie zum Einsatz, die in ersten Studien
    bereits erforscht wurden.</p>

    <p>Nun wird ein digitales Coachingtool bzw. eine Lernplattform zur Veränderung von negativen Gewohnheiten aufgebaut und
    etabliert (B2C), dies ist in Vorbereitung. Unser Hauptfokus aktuell ist der B2B Bereich: wir bauen Kompetenzen für Mitarbeitende
    von Organisationen auf, also Personalentwicklungsmaßnahmen und Trainings. Diese enthalten die mentalen Coachingmethoden,
    zudem individuelle Lernpfade mittels KI-Trainer und wissenschaftlich fundierte Übungen.</p>

    <p>Einsatzfelder (beruflich, privat) sind bspw.: Konflikt- und Beziehungsmanagement (z.B. nicht mehr von Kollegen genervt
    sein), Stressmanagement (z.B. Gefühle von Überforderung reduzieren, Aufschieberitis bzw. Prokrastination angehen), Kommunikationskompetenzen
    verbessern oder auch Präsentationsangst löschen, Gesundheitsverhalten (z.B. weniger Fast Food essen) etc.</p>

    <h2>Aufgaben</h2>

    <p>Du hast Lust auf folgende Schwerpunkte (alles nach vorheriger Einarbeitung):</p>

    <ul>

    <li>Entwicklung von Python-Skripten sowie von Apify-Actors zur Automatisierung von Geschäftsprozessen.</li>

    <li>Verarbeitung, Bereinigung und Deduplizierung großer Datenmengen mit Python und Pandas.</li>

    <li>Entwicklung eines KI-Agenten (LLM) zur Analyse von Unternehmenswebseiten und zur automatischen Ermittlung geeigneter
    Ansprechpartner.</li>

    <li>Entwicklung personalisierter E-Mail-Workflows auf Basis von KI inkl. A/B-Tests für E-Mail-Betreffzeilen und -Texte.</li>

    <li>etc.</li>

    </ul>

    <h2>Qualifikation</h2>

    <p>Du bringst mit:</p>

    <ul>

    <li>Gute Python-Kenntnisse zur sicheren Handhabung von Datenstrukturen, Modulen und objektorientierter Skripterstellung.</li>

    <li>Datenverarbeitung & APIs: Praktische Erfahrungen in der Anbindung externer REST-APIs (JSON, HTTP-Requests).</li>

    <li>Web Scraping & Browser-Automatisierung: gutes Verständnis von HTML/DOM-Strukturen.</li>

    <li>Grundverständnis zum Prompting für die Einbindung von KI-Modellen.</li>

    <li>Ausbildung oder aktuelles Studium in einem der folgenden Bereiche bspw.: Wirtschaftsinformatik, Informatik, Information
    Systems, Digital Business Management, Angewandte Informatik, Software Engineering, Data Science / Business Analytics,
    Künstliche Intelligenz und Data Analytics, Medieninformatik oder vergleichbare Qualifikation.</li>

    <li>Eigenverantwortliches Arbeiten mit viel Gestaltungsspielraum.</li>

    <li>Lust auf direkte Einblicke in die Entwicklung moderner KI-Agenten.</li>

    <li>Flexible Arbeitszeiten, die du dir einteilen kannst.</li>

    <li>Zeitliche Verfügbarkeit von 3-6 Monaten (auch in Teilzeit möglich)</li>

    </ul>

    <h2>Benefits</h2>

    <p>Was dich erwartet:</p>

    <ul>

    <li>Wir können eine Vergütung bieten, sicher aber nicht so hoch wie bei einem Konzern, da wir ein Startup sind.</li>

    <li>Die Möglichkeit ein interessantes Business mitzugestalten und viel zu lernen, bei uns wirst du nicht Kaffee kochen
    oder andere langweilige Dinge erledigen.</li>

    <li>Selbst die mentalen Coaching-Tools nutzen können, um eigene negative Denk- und Verhaltensmuster abbauen zu können
    (Persönlichkeitsentwicklung durch wissenschaftlich-fundierte Methoden).</li>

    <li>Möglichkeiten zur persönlichen und fachlichen Weiterentwicklung, d.h. neben interner Einarbeitung auch externe Schulungen.</li>

    <li>Sehr guter Teamspirit.</li>

    <li>Viele Freiheiten (bspw. komplett remote arbeiten).</li>

    <li>Abwechslung durch verschiedene Aufgabenbereiche.</li>

    <li>Teamevents, bspw. Sommerfeier.</li>

    </ul>

    <p>Klingt das nach dir? Dann freuen wir uns auf deine Bewerbung! Für das Einsenden der Bewerbungsunterlagen werden nur
    Lebenslauf und Zeugnisse als jeweils ein PDF benötigt, mehr nicht.</p>

