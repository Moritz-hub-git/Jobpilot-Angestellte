    <li><strong>Gehalt: 75.000-95.000 Euro</strong> brutto pro Jahr, abhängig von Erfahrung und Verantwortungsumfang</li>

    <li><strong>Hybrid:</strong> Während der Einarbeitung zwei bis drei Tage pro Woche in Karlsruhe, danach je nach Standort
    flexibel, bevorzugt ein bis zwei Tage pro Woche</li>

    </ul>

    <p><strong>Über Mediform</strong></p>

    <p>Mediform ist ein Health-Tech-Startup aus Karlsruhe. Mit <strong>MediVoice</strong> entwickeln wir einen KI-basierten
    Telefonassistenten, der Anliegen in Arztpraxen und MVZ autonom bearbeitet - von der Terminvergabe bis zur Rezeptanfrage.</p>

    <p>Hinter jedem Anruf steht ein verteiltes System aus Telefonie, Echtzeit-Audioverarbeitung, KI-Diensten und Schnittstellen
    zu Praxisverwaltungssystemen. Genau hier kommst du ins Spiel.</p>

    <p><strong>Warum wir diese Rolle schaffen</strong></p>

    <p>Bisher haben die Engineers, die unser Produkt entwickeln, auch Infrastruktur, Observability und operative Schutzmechanismen
    aufgebaut. Mit unserem Wachstum schaffen wir nun erstmals eine dedizierte Reliability-Rolle: für eine Person, die Probleme
    eigenständig untersucht, fundierte Optionen erarbeitet und die gewählte Lösung verlässlich in Produktion bringt.</p>

    <p>Wir priorisieren Reliability-Themen gemeinsam. Du verantwortest Untersuchung, Entscheidungsgrundlage, Umsetzung und
    Follow-through. In den kommenden zwei bis drei Jahren kann dein Verantwortungsbereich mit wachsendem Kontext und Vertrauen
    bis zur übergreifenden Gestaltung der Reliability-Disziplin bei Mediform wachsen.</p>

    <h2>Aufgaben</h2>

    <ul>

    <li><strong>Systeme robust machen:</strong> Du sorgst für Workload-Isolation, Redundanz, sinnvolles Autoscaling und passende
    Cluster-Kapazität - genug Reserven für Lastspitzen, ohne unnötig Ressourcen laufen zu lassen. Störungen sollen gar nicht
    erst zu Ausfällen werden.</li>

    <li><strong>Bekannte Schwachstellen durchdringen:</strong> Du untersuchst bekannte Zuverlässigkeitsrisiken, sammelst belastbare
    Evidenz und bringst konkrete Handlungsoptionen mit.</li>

    <li><strong>Lösungen umsetzen</strong>: Du baust Verbesserungen selbst - als Produktionscode, Infrastructure as Code,
    Automatisierung, Test, Runbook oder technischen Schutzmechanismus.</li>

    <li><strong>Observability betreuen und weiterentwickeln</strong>: Du übernimmst die Pflege unserer Alerting-Infrastruktur
    und verbesserst Signale, Alert-Ownership und Routing - echte Probleme erreichen sofort die richtigen Menschen, Rauschen
    erreicht niemanden.</li>

    <li><strong>Plattform aktuell halten:</strong> Du hältst Kubernetes, Infrastruktur-Charts und Komponenten in einem Rhythmus
    aktuell, der Lifecycle-Risiken kontrolliert, ohne jedes Upgrade zur Top-Priorität zu machen.</li>

    <li><strong>Incidents methodisch begleiten:</strong> Du arbeitest bei Störungen ruhig und methodisch mit, trennst Fakten
    von Annahmen und treibst die abgeleiteten Verbesserungen bis zum Abschluss. Die systemübergreifende Ursachenanalyse wächst
    mit deinem Systemwissen - sie ist ausdrücklich keine Erwartung ab Tag eins.</li>

    <li><strong>Gemeinsame Verantwortung stärken:</strong> Du arbeitest eng mit den Produktteams zusammen. Sie behalten die
    Verantwortung für ihre Systeme; du stärkst gemeinsame Reliability-Praktiken und treibst vereinbarte Maßnahmen bis zum
    Abschluss.</li>

    </ul>

    <p>Die Reihenfolge legen wir anhand von Wirkung, Risiko und Aufwand gemeinsam fest.</p>

    <h2>Qualifikation</h2>

    <ul>

    <li><strong>Produktionserfahrung</strong>: Typischerweise drei bis sechs Jahre Arbeit mit produktiven Systemen, etwa in
    DevOps, SRE, Backend oder Infrastructure Engineering. Entscheidend ist die Qualität deiner Erfahrung, nicht die exakte
    Jahreszahl.</li>

    <li><strong>Troubleshooting und Engineering</strong>: Du gehst auch in unbekannten verteilten Systemen methodisch vor,
    denkst in Failure Modes und Blast Radius und setzt Verbesserungen hands-on in Code, IaC und Automatisierung um.</li>

    <li><strong>Eigeninitiative</strong>: Du wartest nicht nur auf Tickets, sondern bemerkst Probleme, gehst ihnen nach und
    bringst durchdachte Optionen mit.</li>

    <li><strong>Zusammenarbeit:</strong> Du überzeugst durch Evidenz statt Hierarchie, kannst eine andere Teamentscheidung
    professionell mittragen und sprichst erneut klar an, wenn neue Erkenntnisse die Lage verändern.</li>

    <li><strong>Sicherheitsbewusstsein</strong>: Bei patientennahen Systemen behandelst du Identität, korrektes Routing, Mandantentrennung
    und Fail-closed-Verhalten als Teil der Zuverlässigkeit - und fragst nach, bevor du eine unsichere Grenze überschreitest.</li>

    <li><strong>Reflektierte KI-Nutzung:</strong> Du nutzt KI-Werkzeuge pragmatisch, hältst aber Verifikation, Kontext und
    Verantwortung beim Menschen.</li>

    <li><strong>Sprachen:</strong> Sehr gutes Englisch. Deutsch ist hilfreich, aber für diese interne Engineering-Rolle kein
    Muss.</li>

    </ul>

    <p>Ein vollständiger Stack-Match ist nicht nötig. Entscheidend sind deine Arbeitsweise, echte Produktionserfahrung und
    die Fähigkeit, neue technische Domänen zuverlässig zu erschließen.</p>

    <p><strong>Unser technischer Kontext:</strong></p>

    <p>Unser Umfeld umfasst AWS, Kubernetes/EKS, EC2, RDS/PostgreSQL, Prometheus, Grafana, Loki, Sentry, Linux-Netzwerke und
    Infrastructure as Code. Hinzu kommen SIP/RTP-basierte Telefonie, Echtzeit-Audio, GPU-Workloads, externe KI-Dienste sowie
    Integrationen mit Termin- und Praxisverwaltungssystemen.</p>

    <p>Erfahrung mit einzelnen Teilen davon ist ein Plus, aber keine Voraussetzung.</p>

    <p><strong>Wie wir arbeiten:</strong></p>

    <p>Wir treffen technische Entscheidungen in offener Diskussion statt über Hierarchie. Gut begründete Bedenken haben Gewicht,
    und wir ändern den Kurs, wenn die Evidenz dafür spricht.</p>

    <p>Diese Rolle trägt echte Verantwortung, ist aber nicht der Ort, an den Produktionsprobleme oder Schuld weitergereicht
    werden. Bei Incidents verbessern wir Schutzmechanismen und klären Verantwortlichkeiten - ohne Sündenböcke oder Heldenkultur.</p>

    <p>Unser Anrufvolumen beginnt gegen 07:00 Uhr und steigt ab 08:00 Uhr stark an. Ein früher Arbeitsbeginn ist praktisch,
    aber wir suchen keine dauerhaft verfügbare Frühschicht. Wir suchen jemanden, der mit uns sicherstellt, dass ein Ausfall
    um 07:00 Uhr eine entworfene und getestete Antwort hat - unabhängig vom persönlichen Tagesrhythmus.</p>

    <p>Wir sind AI-native: KI gehört für uns zu Code, Untersuchung und Entscheidungsvorbereitung. Urteilsvermögen, Verifikation
    und Verantwortung bleiben menschlich.</p>

