    früh, wo <strong>Daten, Automatisierung und AI</strong> zusätzliche Performance-Potenziale schaffen.</p>

    <p>Wir sind eine <strong>unabhängige Digital-Performance-Agentur aus Deutschland</strong> und verbinden über 25 Jahre
    Marketing-Erfahrung mit <strong>AI, First-Party Data, eigener Technologie und datengetriebenen Lösungen</strong>.</p>

    <p>Als <strong>Senior SEA & Google Ads Manager</strong> steuerst und entwickelst Du anspruchsvolle Accounts für führende
    internationale Kunden. Gleichzeitig hinterfragst Du bestehende Ansätze, testest neue Möglichkeiten und gestaltest gemeinsam
    mit uns die <strong>Zukunft des Search und AI Advertising</strong>.</p>

    <h2>Aufgaben</h2>

    <p><strong>Dein Spielfeld:</strong></p>

    <ul>

    <li><strong>Du gibst die Richtung vor.</strong><br>

    Du steuerst anspruchsvolle nationale und internationale Search-Accounts und entwickelst die strategische Roadmap für nachhaltiges
    Wachstum.</li>

    <li><strong>Du findest Hebel, die andere übersehen.</strong><br>

    Tracking, Feeds, Automatisierung, Skripte und Conversion-Daten sind für Dich keine Einzeldisziplinen, sondern die Grundlage
    für bessere Entscheidungen und messbar mehr Performance.</li>

    <li><strong>Sparringspartner:</strong><br>

    Du hinterfragst Briefings, bringst eigene Ideen ein und berätst Kunden auf Augenhöhe. In Pitches überzeugst Du mit Substanz,
    Klarheit und einem echten Verständnis für das Business.</li>

    <li><strong>Du arbeitest an dem, was als Nächstes kommt.</strong><br>

    Du testest neue Google-Ads-Features, AI-Anwendungen und Werbeplattformen wie ChatGPT Ads, bevor sie zum Standard werden
    – und entwickelst daraus neue Lösungen für unsere Kunden und unser Team.</li>

    </ul>

    <h2>Qualifikation</h2>

    <p><strong>Dein Profil:</strong></p>

    <ul>

    <li><strong>Erfahrung, die Wirkung zeigt.</strong><br>

    Du hast mindestens fünf Jahre Erfahrung im Full-Funnel-SEA und komplexe Google-Ads-Accounts bereits erfolgreich gesteuert.
    Agenturerfahrung ist ein Plus, aber kein Muss.</li>

    <li><strong>Du analysierst messerscharf.</strong><br>

    Du erkennst Muster, hinterfragst Ergebnisse und trennst echte Ursachen von Zufällen. Aus komplexen Daten leitest Du klare
    Entscheidungen, Tests und konkrete Wachstumshebel ab.</li>

    <li><strong>Du wartest nicht auf Aufgaben.</strong><br>

    Du siehst Potenziale früh, entwickelst eigene Lösungen und übernimmst Verantwortung für deren Umsetzung. Du bringst Themen
    aktiv voran, statt nur Briefings abzuarbeiten.</li>

    <li><strong>Du kommunizierst klar und überzeugend.</strong><br>

    Du beherrschst Deutsch verhandlungssicher und kannst komplexe Zusammenhänge verständlich vermitteln – intern wie im direkten
    Austausch mit Kunden. Gute Englischkenntnisse sind von Vorteil.</li>

    <li><strong>Du beherrschst den modernen SEA-Stack.</strong><br>

    Google Ads, Search Ads 360, Merchant Center, Tracking und Analytics gehören für Dich zum Alltag. Entscheidend ist nicht
    nur, dass Du die Tools bedienen kannst, sondern dass Du aus ihnen bessere Entscheidungen ableitest.</li>

    </ul>

    <h2>Benefits</h2>

    <p><strong>Was wir Dir bieten:</strong></p>

    <ul>

    <li><strong>100 % remote und flexibel.</strong><br>

    Du arbeitest eigenverantwortlich, mit kurzen Entscheidungswegen und ohne unnötige Präsenzpflicht.</li>

    <li><strong>Verantwortung statt Micromanagement.</strong><br>

    Du bekommst den Freiraum, Strategien mitzugestalten, eigene Ideen umzusetzen und Themen wirklich voranzubringen.</li>

    <li><strong>Tech, Data und AI statt Agenturstandard.</strong><br>

    Du arbeitest mit modernen Marketing-Technologien, unseren eigenen Tools und erfahrenen Spezialisten aus Search, Data und
    Tech.</li>

    <li><strong>Benefits, die zählen.</strong><br>

    EGYM Wellpass, Bike-Leasing, moderne Ausstattung und ein fachlich starkes Team.</li>

