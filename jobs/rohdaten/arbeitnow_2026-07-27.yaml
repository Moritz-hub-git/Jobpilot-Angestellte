  url: https://www.arbeitnow.com/jobs/companies/bridgemaker-gmbh/ai-process-automation-consultant-berlin-222343
  beschreibung: '<h2>Über die Position</h2>

    <p>Automatisierung funktioniert nur, wenn sie auf dem realen Prozess aufsetzt. Deshalb beginnen wir beim Kunden: mit den
    Menschen, die den Prozess täglich ausführen, den Systemen, in denen die Daten liegen, und den Regeln, nach denen Entscheidungen
    fallen.</p>

    <p>Als AI Process Automation Consultant analysierst du diese Abläufe, übersetzt sie in technische Logik und bringst sie
    in die Umsetzung. Du entwickelst Blueprints, konfigurierst einfache Workflows selbst und arbeitest bei komplexeren Lösungen
    eng mit Engineering.</p>

    <p>Der aktuelle Schwerpunkt liegt auf unserem Commercial OS für Vertrieb, Marketing und Service. Weitere Produkte setzen
    entlang der operativen Prozesse unserer Kunden an. Was sich in einem Projekt bewährt, überführen wir in Standards und
    wiederverwendbare Bausteine für weitere Kunden und Produkte.</p>

    <p><strong>Deine Rolle</strong></p>

    <p>Du verbindest Prozessberatung und technische Umsetzung.</p>

    <p>Dafür führst du Interviews und Workshops, beobachtest Abläufe vor Ort und analysierst die beteiligten Systeme und Daten.
    Aus diesen Informationen entwickelst du einen Blueprint. Er beschreibt Ist- und Soll-Prozess, Rollen, Systeme, Datenobjekte,
    Geschäftsregeln, Ausnahmen und Testfälle so konkret, dass daraus eine funktionierende Automatisierung entstehen kann.</p>

    <p>Die Rolle endet nicht bei der Dokumentation. Einfache Workflows konfigurierst und testest du selbst, zum Beispiel in
    n8n oder HubSpot. Bei komplexeren Integrationen, Architekturfragen und produktiver Softwareentwicklung arbeitest du mit
    Engineering. Deployment und technischer Betrieb bleiben dort.</p>

    <p>Wir bauen die Einheit gerade auf. Deshalb hängt dein Schwerpunkt vom Kunden und von der Projektphase ab. In manchen
    Wochen führst du vor allem Interviews und Workshops. In anderen setzt du Workflows um, prüfst Daten oder testest Lösungen.
    Diese Nähe zwischen Prozess und Umsetzung ist gewollt: Du siehst direkt, ob dein Blueprint in der Praxis trägt.</p>

    <h2>Anforderungen</h2>

    <p>Du musst nicht bereits Prozessberatung und technische Umsetzung in gleicher Tiefe beherrschen. Du kannst aus einem
    von zwei Profilen kommen.</p>

    <p>Du hast bereits in Prozessberatung, Business Analysis oder Operations gearbeitet und willst näher an Daten und technischer
    Umsetzung arbeiten. Oder du kommst aus Wirtschaftsinformatik, Data Science, Operations Research, Process Mining oder einem
    vergleichbaren analytisch-technischen Umfeld und willst stärker mit Kunden, Prozessen und wirtschaftlichen Entscheidungen
    arbeiten.</p>

    <p>Unabhängig von deinem bisherigen Weg bringst du mit:</p>

    <ul>

    <li>Du zerlegst komplexe Abläufe in Schritte, Rollen, Systeme, Daten, Regeln und Ausnahmen.</li>

    <li>Du kannst Interviews und Workshops strukturieren und klar führen.</li>

    <li>Du kommunizierst sicher mit operativen Teams und leitenden Stakeholdern.</li>

    <li>Du bringst SQL-Grundkenntnisse mit und kannst Datenstrukturen und Schnittstellen nachvollziehen.</li>

    <li>Du bist technisch genug, um einfache Workflows selbst zu konfigurieren und komplexere Anforderungen mit Engineering
    zu klären.</li>

    <li>Du erkennst, wie Prozesse Umsatz, Kosten, Geschwindigkeit, Conversion oder Kundenbindung beeinflussen.</li>

    <li>Du arbeitest dich schnell in neue Prozesse, Systeme und Werkzeuge ein.</li>

    <li>Du sprichst fließend Deutsch und gutes Englisch.</li>

    </ul>

    <h2>Was dir beim Einstieg hilft</h2>

    <ul>

    <li>praktische Erfahrung mit BPMN,</li>

    <li>Erfahrung mit HubSpot oder einem vergleichbaren CRM,</li>

    <li>Erfahrung mit n8n, Zapier, Make oder anderen Workflow-Tools,</li>

    <li>Kenntnisse in Process Mining,</li>

    <li>Erfahrung mit API-basierten Integrationen und Datenmodellen,</li>

    <li>und erste Berührungspunkte mit Claude Code, Cursor oder vergleichbaren AI-gestützten Entwicklungswerkzeugen.</li>

    </ul>

    <p>Diese Punkte helfen dir beim Einstieg, sind aber keine Ausschlusskriterien. Entscheidend ist, dass du Prozesse strukturiert
    verstehen kannst, technische Logik nicht scheust und Verantwortung für das Ergebnis übernimmst.</p>

    <p><strong>Erfahrung und Einstufung</strong></p>

    <p>Wir suchen Menschen mit 1 bis 4 Jahren relevanter Berufserfahrung. Dabei zählt nicht nur die Dauer, sondern vor allem,
    welche Aufgaben du bereits eigenständig übernommen hast. Relevante Erfahrung kannst du in Prozessberatung, Business Analysis,
    Operations, Data Science, Wirtschaftsinformatik, Process Mining oder technischer Umsetzung gesammelt haben.</p>

    <p>Wir besetzen die Rolle je nach Erfahrung und Verantwortung als Consultant oder Senior Consultant. Eine Senior-Einstufung
    ist auch innerhalb dieses Erfahrungsrahmens möglich, wenn du bereits:</p>

    <ul>

    <li>Prozessarbeit eigenständig strukturierst und steuerst,</li>

    <li>Interviews und Workshops mit operativen und leitenden Stakeholdern sicher führst,</li>

    <li>belastbare Blueprints, Geschäftsregeln und Testfälle entwickelst,</li>

    <li>einfache Automatisierungen selbst umsetzt,</li>

    <li>mit Engineering technische Entscheidungen vorbereitest,</li>

    <li>und für Ergebnisse und Abnahmen Verantwortung übernimmst.</li>

    </ul>

    <p>BPMN-Praxis hilft dir dabei. Für die Senior-Einstufung sind dein tatsächlicher Verantwortungsumfang und deine fachliche
    Selbstständigkeit wichtiger als eine feste Zahl an Berufsjahren.</p>

    <h2>Aufgabenbereich</h2>

    <h2>Prozesse verstehen und als Blueprint abbilden</h2>

    <ul>

    <li>Du nimmst Ist-Prozesse in Vertrieb, Marketing, Service und Operations auf, in Workshops, Interviews und durch Beobachtung
    vor Ort.</li>

    <li>Du sprichst mit operativen Teams und leitenden Stakeholdern und bringst unterschiedliche Sichtweisen in ein gemeinsames
    Prozessbild.</li>

    <li>Du modellierst Prozesse in BPMN und machst Brüche, manuelle Arbeit, Ausnahmen und Automatisierungspotenziale sichtbar.</li>

    <li>Du entwirfst Soll-Prozesse, stimmst sie mit dem Kunden ab und dokumentierst die notwendigen Entscheidungen.</li>

    <li>Du definierst Datenobjekte, Geschäftsregeln, Validierungen, Ausnahmen, Rollen und Akzeptanzkriterien.</li>

    <li>Du bewertest Prozessprobleme nach wirtschaftlicher Wirkung und technischer Machbarkeit, zum Beispiel anhand von Durchlaufzeit,
    Conversion, Datenqualität, Vertriebsproduktivität oder Kundenbindung.</li>

    <li>Du entwickelst unseren Blueprint-Standard und eine wiederverwendbare Prozessbibliothek weiter.</li>

    </ul>

    <h2>Automatisierungen umsetzen und testen</h2>

    <ul>

    <li>Du übersetzt Blueprints in technische Logik und konkrete Umsetzungsschritte.</li>

    <li>Du konfigurierst einfache Workflows und Automatisierungen selbst.</li>

    <li>Du arbeitest bei komplexeren Lösungen mit Engineering an Datenmodellen, Schnittstellen und Geschäftslogik.</li>

    <li>Du prüfst Datenqualität, dokumentierst Lücken und entwickelst mit dem Kunden einen belastbaren Umgang damit.</li>

    <li>Du formulierst Testfälle, führst fachliche Tests durch und begleitest die Abnahme.</li>

    <li>Du stellst sicher, dass Engineering alle fachlichen Regeln, Abhängigkeiten und Akzeptanzkriterien kennt.</li>

    <li>Du dokumentierst wiederkehrende Muster, damit wir sie in weiteren Projekten schneller einsetzen können.</li>

    </ul>

    <p><strong>Die Zusammenarbeit mit Engineering</strong></p>

    <p>Die Grenze zwischen deiner Rolle und Engineering verläuft nach Komplexität, Risiko und Betriebsverantwortung.</p>

    <p>Du verantwortest die Prozessanalyse, den Blueprint, die fachliche Logik, einfache Workflows, die Testfälle und die
    fachliche Abnahme. Engineering verantwortet Architekturentscheidungen, komplexe Integrationen, produktive Individualsoftware,
    Deployment, Monitoring und technischen Betrieb.</p>

    <p>Technische Machbarkeit, Datenmodelle, Tests und Fehleranalyse bearbeitet ihr gemeinsam.</p>

    <h2>Die Perspektive</h2>

    <p><strong>Dein Start bei Bridgemaker</strong></p>

    <p>Du lernst unsere Produkte, Kundenprozesse, Blueprint-Standards und Delivery-Arbeit im Projekt kennen. Gemeinsam mit
    erfahrenen Kolleg:innen übernimmst du schrittweise eigene Interviews, Workshops, Blueprints und Abstimmungen mit Engineering.</p>

    <p>Weil die Einheit noch klein ist, arbeitest du zunächst über einen breiten Teil der Delivery hinweg. Du analysierst
    Prozesse, entwickelst die fachliche Logik und setzt einfache Workflows selbst um. Mit dem Wachstum der Einheit werden
    die Verantwortungen spezialisierter. Du kannst dich stärker in Richtung komplexes Blueprinting und Kundensteuerung, Automation
    Delivery oder fachliche Führung entwickeln.</p>

    <p>Deine Arbeit fließt direkt in Kundenprojekte ein. Was sich bewährt, wird Teil unseres Standards für weitere Roll-outs.</p>

    <p><strong>Über Bridgemaker</strong></p>

    <p>Bridgemaker ist die Digitalberatung für KI-Transformation an der Kundenschnittstelle. Wir begleiten etablierte Unternehmen
    dabei, KI dort einzusetzen, wo Umsatz entsteht: in Vertrieb, Marketing, Service und neuen Geschäftsmodellen.</p>

    <p>Wir verbinden Strategie und Umsetzung. Wir analysieren, bauen und übergeben und bleiben so lange in der Verantwortung,
    bis die Lösung im Betrieb trägt. Rund 50 Mitarbeitende arbeiten von Berlin aus für Unternehmen im DACH-Raum, darunter
    Siemens und Jungheinrich. Bridgemaker wurde 2016 gegründet und ist zu 100 Prozent inhabergeführt.</p>

    <p><strong>Arbeitsort und Reisen</strong></p>

    <p>Dein Standort ist Berlin. Wir arbeiten hybrid und treffen uns regelmäßig in unserem Office. Für Workshops, Interviews
    und Prozessbeobachtungen bist du auch bei Kunden vor Ort, überwiegend im DACH-Raum. Als Richtwert planst du mit bis zu
    5 Reisetagen pro Monat.</p>

    <h2>Was wir dir bieten</h2>

    <ul>

    <li>direkte Zusammenarbeit mit Kunden, Product und Engineering,</li>

    <li>Verantwortung vom ersten Prozessinterview bis zur fachlichen Abnahme,</li>

    <li>die Möglichkeit, den Blueprint- und Delivery-Standard einer wachsenden Einheit mitzuentwickeln,</li>

    <li>Mentoring durch Partner und erfahrene Growth Leads,</li>

    <li>ein hybrides Arbeitsmodell mit Office in Berlin,</li>

    <li>einen Zuschuss zur Urban-Sports-Mitgliedschaft oder einen zusätzlichen Urlaubstag,</li>

    <li>und JobRad- sowie JobAuto-Angebote.</li>

    </ul>

    <p><strong>Passt die Rolle zu dir?</strong></p>

    <p>Du musst nicht jedes Werkzeug bereits beherrschen. Wir suchen jemanden, der reale Prozesse verstehen, technische Logik
    daraus entwickeln und einfache Automatisierungen selbst umsetzen kann.</p>

    <p>Wenn du dich zwischen Beratung, Business Analysis und technischer Umsetzung bewegst und genau dort arbeiten willst,
    möchten wir dich kennenlernen.</p>

