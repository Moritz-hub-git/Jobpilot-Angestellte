    <p>Founded in 2020, Superchat has become the platform of choice for <strong>10,000+ businesses worldwide</strong>, from
    globally recognized brands like Allianz, Auto1, Enpal, Danone, and GASAG to the small businesses, dental practices, and
    one-person startups that need to look bigger than they are. Today, <strong>millions of messages flow through Superchat
    every single day</strong>.</p>

    <p>We started as a unified inbox: one place for every channel a customer might pick, WhatsApp, email, SMS, Instagram.
    Then ChatGPT happened, and the second chapter began: AI agents that respond across chat, email, and voice at the quality
    of the best human teams.</p>

    <p>We''re <strong>100 people</strong>, <strong>profitable</strong>, and have raised <strong>€18M in funding</strong> (last
    round 4.5 years ago, we''ve been growing on our own money since). Headquartered in Berlin.</p>

    <p><em>As a Senior Revenue Operations Engineeer you anchor the build end of Revenue Operations - our internal product
    team whose customers are the GTM functions: Sales, CS, Marketing, and Finance. You build the AI, automation, and data
    foundations that make these teams faster, smarter, and more scalable, owning the end-to-end delivery of internal tools,
    integrations, and AI-powered workflows - from problem framing and architecture through launch, adoption, and measurable
    business impact.</em></p>

    <h4><span style="text-decoration: underline;"><strong>Who We Want</strong></span></h4>

    <p><strong>Proven GTM Systems Builder.</strong></p>

    <p>You bring 3+ years of hands-on experience in RevOps, GTM Engineering, SalesOps, Business Systems, or a comparable B2B
    SaaS role, and can show production systems you personally built.</p>

    <p><strong>AI-Native Builder.</strong></p>

    <p>You''ve integrated LLMs into real workflows or tools through APIs and understand how to move beyond prompting into
    reliable, production-ready use cases.</p>

    <p><strong>Product-Minded Systems Thinker.</strong></p>

    <p>You start with the user and business problem, map the relevant process and data dependencies, and choose the simplest
    scalable solution rather than defaulting to a particular tool.</p>

    <p><strong>Integration &amp; Data Fluent.</strong></p>

    <p>You''re comfortable working with APIs, webhooks, JSON, authentication, data models, and the movement of data between
    multiple systems.</p>

    <p><strong>End-to-End Owner.</strong></p>

    <p>You can take a project from discovery and architecture through building, testing, rollout, documentation, monitoring,
    and ongoing improvement.</p>

    <p><strong>Pragmatic Production Engineer.</strong></p>

    <p>You ship quickly without treating reliability as optional, including appropriate testing, error handling, security,
    observability, and documentation.</p>

    <p><strong>Business-Impact Oriented.</strong></p>

    <p>You connect technical work to measurable outcomes such as pipeline, productivity, data quality, speed, cost, or customer
    experience.</p>

    <p><strong>Clear Cross-Functional Communicator.</strong></p>

    <p>You can explain technical decisions simply, manage trade-offs, work through ambiguity, and collaborate effectively
    with both technical and non-technical stakeholders.</p>

    <p>You are fluent in written and spoken English; German is a plus.</p>

    <p><strong>Curious &amp; Self-Directed.</strong></p>

    <p>You actively experiment with new technologies, learn through building, and share useful findings without chasing novelty
    for its own sake.</p>

    <h4><span style="text-decoration: underline;">Who We Don’t Want</span></h4>

    <p><strong>Surface-Level Operator.</strong></p>

    <p>You''ve used CRM and AI tools but lack hands-on experience building automations, configuring systems, or solving operational
    problems end-to-end.</p>

    <p><strong>Limited Business Acumen.</strong></p>

    <p>You struggle to understand cross-functional GTM processes and how operational decisions impact the wider business.</p>

    <p><strong>Weak Systems &amp; Data Foundations.</strong></p>

    <p>You struggle with APIs, JSON, data models, authentication, debugging, or moving data reliably between systems.</p>

    <p><strong>Weak Business Communicator.</strong></p>

    <p>You cannot explain technical choices clearly, manage trade-offs, influence stakeholders, or connect a build to its
    wider business impact.</p>

    <p><strong>Chat-Only AI Experience.</strong></p>

    <p>You use ChatGPT or Claude but cannot show an LLM-powered workflow, integration, or tool you''ve personally built and
    shipped.</p>

    <p><strong>One-Off Hacker.</strong></p>

    <p>You build isolated automations without considering maintainability, documentation, ownership, failure handling, or
    how the solution fits into the wider architecture.</p>

    <h4><span style="text-decoration: underline;">Your Day To Day</span></h4>

    <p><strong>Building: AI, Automation &amp; Systems (ca. 65%)</strong></p>

    <ul>

    <li>You identify and productionize high-leverage AI use cases across Sales, Customer Success, Marketing, and Finance,
    including LLM integrations, workflow design, evaluation, guardrails, and monitoring</li>

    <li>You design and build lightweight internal applications and interfaces that remove recurring manual work, improve decision-making,
    and are simple for teams to adopt</li>

    <li>You build end-to-end workflows using Make, n8n, and custom logic, including business rules, system handoffs, error
    handling, alerts, and ongoing monitoring</li>

    <li>You create clean, maintainable data flows between HubSpot, the data warehouse, billing, support, and other GTM tools
    using APIs, webhooks, enrichment pipelines, and data activation</li>

    <li>You work deeply within HubSpot''s objects, properties, workflows, and integration layer to support complex use cases
    without creating fragile or unnecessarily complicated architecture</li>

    </ul>

    <p><strong>Discovery &amp; Solution Design (ca. 15%)</strong></p>

    <ul>

    <li>You translate scoped or ambiguous business problems into clear technical solutions, define success metrics, and choose
    the simplest approach that can deliver meaningful impact</li>

    </ul>

    <p><strong>Deployment, Adoption &amp; Documentation (ca. 20%)</strong></p>

    <ul>

    <li>You test, document, deploy, and iterate on solutions with end users so they remain secure, maintainable, reliable,
    and useful after launch</li>

    </ul>

    <h4><span style="text-decoration: underline;">Stakeholders</span></h4>

    <p><strong>RevOps:</strong> Your peers and manager to collaborate on projects and daily initiatives<br><strong>Engineering
    team:</strong> Coordinate with engineers for projects that may require product know how and integration across the engineering
    tool stack GTM teams as and when required</p>

    <h4><span style="text-decoration: underline;">Why People Choose Us</span></h4>

    <ul>

    <li>We believe in the power of in-person collaboration: You''ll work with your team from our Berlin office at least three
    days a week. Some of the best ideas happen when we''re in the same room - decisions are made faster, we learn from each
    other, and we grow stronger as a team.</li>

    <li>We''re an international team with diverse cultural backgrounds and languages. Openness, mutual respect, and the exchange
    of different perspectives shape the way we work together.</li>

    <li>We value ambition and drive. We''re looking for people who take ownership, show initiative, and are excited to grow
    quickly.</li>

    <li>We work with a high degree of ownership and a strong learning mindset. Asking questions, staying curious, and continuously
    improving are part of our everyday culture.</li>

    <li>We care deeply about humility and teamwork. No egos, open feedback, and a willingness to learn from one another matter
    more to us than titles.</li>

    </ul>

    <p><strong>Benefits &amp; Culture</strong></p>

    <ul>

    <li>Choose between an Urban Sports Club or John Reed membership, or a public transport pass/Dance subscription.</li>

    <li>Regular company-wide and team events.</li>

    <li>An annual €500 learning and development budget that you can use for conferences, courses, books, career coaching,
    and more.</li>

    <li>An inclusive and exciting startup culture that supports rapid professional and personal growth.</li>

    <li>A beautiful office in the heart of Berlin (Prenzlauer Allee 242) with free snacks, drinks, and top-notch equipment.</li>

    </ul>

    <p><strong>We want to build a community, not just a company.</strong></p>

    <p>Creating an environment where people genuinely enjoy spending time together is important to us - whether that''s through
    HYROX training, golf, beer pong tournaments, running clubs, Warhammer, weekend activities, or any other community you''d
    like to build here.</p>

    <p><strong>We believe that diversity makes companies stronger. We welcome applications from everyone, regardless of gender,
    background, nationality, or religion. Feel free to apply - we''d love to hear from you!</strong></p>

    <p><strong>By submitting your application, you agree to our Privacy Policy.</strong></p>

    <p><strong>We look forward to receiving your application! 🙂</strong></p>

