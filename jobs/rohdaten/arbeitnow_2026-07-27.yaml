    <p>Du bist Unternehmer und Kundenversteher: Macher, belastbar, Teamplayer, mit ausgeprägter Dienstleistungsmentalität.
    Für dich zählt eine Frage jeden Tag: Wie machen wir unsere Kunden noch zufriedener, und wie steigern wir Automatisierung
    und Servicequalität gleichzeitig? Die ersten 12 bis 18 Monate bist du voll operativ in Sales und Kundenservice, danach
    baust du dedizierte Funktionen auf.</p>

    <ul>

    <li><strong>Sales:</strong> Du baust die Pipeline von Erstkontakt bis Abschluss selbst auf. Du akquirierst Steuerberater
    als Multiplikatoren und/oder Endkunden (SPV-Initiatoren, z.B. Real Estate und EE) und verantwortest die Metriken SPVs
    under Management und Kundenzufriedenheit.</li>

    <li><strong>Customer Success:</strong> Du bist One Face to the Customer für die ersten Pilotkunden. In Jahr 1 nimmst du
    jede Anfrage persönlich auf, klärst sie intern mit Tech- und Accounting-Specialist und lieferst das Ergebnis zurück. Wiederkehrende
    Kundenanforderungen übersetzt du in Automatisierungs- und Produktanforderungen.</li>

    <li><strong>Marketing:</strong> Du erstellst Pitch- und Kundenpräsentationen in professioneller Qualität selbst und verantwortest
    Website-Kommunikation und Social-Media-Content (Positionierung, Frequenz, Inhalte).</li>

    <li><strong>Network und Partnerships:</strong> Du vertrittst das Unternehmen auf Events, Pitch- und Networking-Formaten
    in DACH und Luxemburg und akquirierst und managst Partner (Steuerberater, Fondsdienstleister, Multiplikatoren).</li>

    <li><strong>Unternehmenssteuerung</strong>: Du betreibst rollierendes Liquiditätsmanagement gegen den Business Case. Du
    verantwortest Hypothesentests und Strategie-Updates, entscheidest Änderungsbedarfe und Pivots und setzt sie um. Du definierst
    Ziele auf Basis der Strategie und führst Fundraising durch, falls nötig</li>

    </ul>

    <h2>Qualifikation</h2>

    <p><strong>Must-Have:</strong></p>

    <ul>

    <li><strong>Sales-Track-Record:</strong> Du hast nachweisbar anspruchsvolle B2B-Kunden akquiriert und Abschlüsse selbst
    verantwortet, nicht nur begleitet.</li>

    <li><strong>Kunden- und Serviceorientierung</strong>: Du denkst vom Kundenproblem her, reagierst schnell und lieferst
    zuverlässig. Service ist für dich Kern des Geschäftsmodells, nicht Kostenstelle.</li>

    <li><strong>Fachverständnis Steuern, Buchführung und Accounting:</strong> Du verstehst die Leistung fachlich (Buchungslogik,
    Jahresabschluss, Rolle des Steuerberaters), führst Kundengespräche auf Augenhöhe und verantwortest den Kundenservice fachlich.</li>

    <li><strong>Kommunikation und Netzwerken</strong>: Du kommunizierst stark schriftlich und verbal und bist leidenschaftlicher
    Netzwerker.</li>

    <li><strong>Design und Außenauftritt:</strong> Du hast ein Auge für Design und erstellst Präsentationen und Außenauftritt
    auf professionellem Niveau ohne externe Agentur.</li>

    <li><strong>Technisches Go-to-Market</strong>: Du setzt ein CRM eigenständig auf und hältst es sauber und baust einfache
    Sales- und Workflow-Automationen selbst (n8n, Make o.ä.).</li>

    <li><strong>Praktische AI-Kompetenz</strong>: Du nutzt gängige Tools (Claude, ChatGPT, Langdock etc.) täglich in deinem
    Workflow und hast erste eigene AI-Workflows produktiv umgesetzt.</li>

    <li><strong>Analytische Fähigkeiten:</strong> Du rechnest Business Cases eigenständig, betreibst Liquiditätsplanung und
    leitest daraus Entscheidungen ab.</li>

    <li><strong>Unternehmerischer Track-Record:</strong> Du hast ein Projekt oder Unternehmen mit aufgebaut und Durststrecken
    durchgestanden.</li>

    <li><strong>Führung:</strong> Du gibst klar die Richtung vor und führst Tech- und Accounting-Specialist über Ziele, während
    beide ihren Bereich eigenständig verantworten.</li>

    <li><strong>Sprachen:</strong> Du sprichst Deutsch und Englisch fließend</li>

    <li><strong>Erfahrung und Ausbildung:</strong> Du hast mind. 5 Jahre Berufserfahrung und einen exzellenten akademischen
    und beruflichen Track-Record (Fachrichtung zweitrangig).</li>

    <li><strong>Standort:</strong> Du bist in Saarbrücken/Saarland vor Ort tätig</li>

    </ul>

    <p><strong>Das wäre ein Plus:</strong></p>

    <ul>

    <li><strong>Steuerberater-Netzwerk</strong>: Du hast ein belastbares Netzwerk und im Optimalfall bereits an Steuerberater
    verkauft.</li>

    <li><strong>Luxemburg:</strong> Du bringst Netzwerk und Markterfahrung mit (Fondsstandort, RCS, Dienstleisterlandschaft).</li>

    <li><strong>Branchenerfahrung</strong>: Du kennst Accounting/Steuern im Bereich Real Estate und Erneuerbare Energien.</li>

    <li><strong>Stationen</strong>: Du hast in Strategieberatung, Start-up oder Scale-up gearbeitet.</li>

